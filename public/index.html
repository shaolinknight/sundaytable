function statusInfo() {
  var n = S.outbox.length;
  if (!connected()) return { cls: '', text: 'Not backed up', title: 'Only on this device. Tap to connect your Google Sheet.' };
  if (S.awaitSeed) return { cls: 'wait', text: 'Sheet is empty', title: 'Choose what to do in Settings' };
  if (UI.syncState === 'busy') return { cls: 'busy wait', text: n ? 'Saving ' + n + '…' : 'Syncing…', title: '' };
  if (UI.syncState === 'err') return { cls: 'err', text: 'Not syncing', title: UI.syncMsg };

/* ===================== plan the week ===================== */
function weekDays(offset) {
  var t = parseDay(today());
  var startDow = S.settings.weekStart === 'mon' ? 1 : 0;
  var back = (t.getDay() - startDow + 7) % 7;
  var start = new Date(t.getFullYear(), t.getMonth(), t.getDate() - back + 7 * (offset || 0));
  var out = [];
  for (var i = 0; i < 7; i++) {
    var d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    out.push(d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()));
  }
  return out;
}
function dayLabel(key, long) {
  var d = parseDay(key);
  return (long ? ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d.getDay()] : DAYS[d.getDay()]) + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
}
/** What you logged as made on a day (newest last). */
function madeFor(day) { return S.cooked.filter(function (c) { return c.date === day; }); }
/** A day's plan and what you actually made: planned rows marked made, and made-but-not-planned rows of their own. */
function dayMeals(day) {
  var plan = planFor(day), made = madeFor(day).slice(), used = {};
  var rows = plan.map(function (e) {
    var hit = made.filter(function (c) { return c.rid === e.rid && !used[c.id]; })[0];
    if (hit) used[hit.id] = 1;
    return { e: e, made: hit || null };
  });
  made.forEach(function (c) { if (!used[c.id]) rows.push({ c: c }); });
  return rows;
}
function planFor(day) { return S.plan.filter(function (e) { return e.date === day; }).sort(function (a, b) { return a.id.localeCompare(b.id); }); }
function entryFactor(e, r) {
  if (!r) return 1;
  var meals = isBatchable(r) ? entryMeals(e) : 1;
  if (r.servings) return (e.servings ? e.servings / r.servings : 1) * meals;
  return e.servings ? +e.servings : 1;          // no servings on the recipe: the number is "× batch"
}
function servingsLabel(e, r) {
  if (!r) return '';
  if (isBatchable(r) && entryMeals(e) > 1) { var ppl = +e.servings || r.servings; return 'Prep: ' + fmtNum(ppl) + (ppl === 1 ? ' person' : ' people') + ' × ' + entryMeals(e) + ' meals'; }
  if (r.servings) return servingsText(r, entryFactor(e, r));
  return e.servings && +e.servings !== 1 ? '×' + fmtNum(+e.servings) + ' batch' : '';
}

function dayHtml(d) {

  var h = '<section class="day' + (d === t ? ' today' : '') + (past ? ' past' : '') + '"><div class="dayh"><h2>' + esc(dayLabel(d, true)) + '</h2>' + (d === t ? '<span class="badge">Today</span>' : '') + '</div>';
  rows.forEach(function (x) {
    if (x.c) {   // made, without being planned

      h += '<button class="prow made" data-act="cookedopen" data-id="' + esc(x.c.id) + '">' + (rc ? tileHtml(rc) : '<span class="tile" style="--pig:#6A4E3A"><span class="lt">' + esc((x.c.title || '?').charAt(0)) + '</span></span>') +
        '<span class="info"><span class="nm">' + esc(rc ? rc.title : (x.c.title || 'Deleted recipe')) + '</span><span class="sub"><span class="madetag">' + icon('check') + 'Made</span>' + (x.c.note ? ' · ' + esc(x.c.note) : '') + '</span></span></button>';

      '<span class="info"><span class="nm">' + esc(r ? r.title : (e.title || 'Deleted recipe')) + '</span>' + (sl || x.made ? '<span class="sub">' + (x.made ? '<span class="madetag">' + icon('check') + 'Made</span>' + (sl ? ' · ' : '') : '') + esc(sl) + '</span>' : '') + '</span></button>';
  });

function viewSeg() {

/* ---------- a calendar month ---------- */
function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function weekdayHeads() { var s = S.settings.weekStart === 'mon' ? 1 : 0, o = []; for (var i = 0; i < 7; i++) o.push(DAYS[(s + i) % 7].slice(0, 2)); return o; }
/** Days to show for a month: whole weeks, from the week the 1st falls in */
function monthDays(off) {
  var t = parseDay(today()), first = new Date(t.getFullYear(), t.getMonth() + (off || 0), 1);
  var s = S.settings.weekStart === 'mon' ? 1 : 0, back = (first.getDay() - s + 7) % 7;
  var start = new Date(first.getFullYear(), first.getMonth(), 1 - back), out = [];
  var last = new Date(first.getFullYear(), first.getMonth() + 1, 0);
  var n = Math.ceil((back + last.getDate()) / 7) * 7;
  for (var i = 0; i < n; i++) out.push(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
  return { first: first, days: out };
}
function calCell(d, opts) {
  var k = dayKey(d), t = today(), rows = dayMeals(k), es = planFor(k), past = k < t, nMade = rows.filter(function (x) { return x.c || x.made; }).length;

  var marks = rows.slice(0, 3).map(function (x) { var r = byId(x.c ? x.c.rid : x.e.rid); return '<i' + (x.c || x.made ? ' class="m"' : '') + ' style="--pig:' + (r ? pigmentFor(r) : '#6A4E3A') + '"></i>'; }).join('') + (rows.length > 3 ? '<em>+' + (rows.length - 3) + '</em>' : '');
  return '<button class="' + cls + '" data-act="' + opts.act + '" data-day="' + k + '"' + (opts.id ? ' data-id="' + esc(opts.id) + '"' : '') + (past && opts.noPast ? ' disabled' : '') +
    ' aria-label="' + esc(label) + '"' + (opts.sel === k ? ' aria-pressed="true"' : '') + '><span class="dn">' + d.getDate() + '</span><span class="mk">' + marks + '</span></button>';

function renderMonth(pane) {

    m.days.map(function (d) { return calCell(d, { act: 'calday', sel: UI.planDay, other: m.first.getMonth() }); }).join('') + '</div></div>';

/** the 7 days (from your week start) containing a day */
function weekOf(day) {

        '<p class="hint">' + (m > 1 ? 'A prep batch: cooking ' + esc(servingsText(r, entryFactor(e, r)).toLowerCase()) + '. Your list and Cook mode use that amount.' : 'Cooking more than one meal\'s worth? Raise "Meals it covers" to make it a prep batch.') + '</p>';

    }

  return h;
}

function planShopSources(days) {
  var src = [];
  days.forEach(function (d) {
    planFor(d).forEach(function (e) { var r = byId(e.rid); if (r) src.push({ recipe: r, factor: entryFactor(e, r) }); });
  });
  return src;
}

/* ===================== meal prep: how often, batches, regulars, the fridge ===================== */
function addDays(day, n) { var d = parseDay(day) || parseDay(today()); d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function daysUntil(day) { return -daysAgo(day); }
var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

/** A guess at how often you make something, from when you've made it. */
function suggestFreq(r) {
  var dates = S.cooked.filter(function (c) { return c.rid === r.id; }).map(function (c) { return c.date; });
  if (!dates.length) return null;
  var n8 = dates.filter(function (d) { return daysAgo(d) <= 56; }).length;
  var n90 = dates.filter(function (d) { return daysAgo(d) <= 90; }).length;
  if (n8 >= 4) return { k: 'weekly', why: 'You\'ve made it ' + n8 + ' times in the last 8 weeks.' };
  if (n90 >= 1) return { k: 'sometimes', why: 'You\'ve made it ' + (n90 === 1 ? 'once' : n90 + ' times') + ' in the last 3 months.' };
  return { k: 'rare', why: 'Last made ' + niceDate(dates.sort().pop()) + '.' };
}

function isBatchable(r) { return !!(r && r.servings && isPeople(r)); }
function entryMeals(e) { return Math.max(1, +e.meals || 1); }
function prepDayOf(days) {
  var want = +S.settings.prepDay || 0;
  for (var i = 0; i < days.length; i++) if (parseDay(days[i]).getDay() === want) return days[i];
  return days[0];
}

/** Put every "Every week" recipe on this week's prep day, as a batch. */
function addRegulars() {
  var days = weekDays(UI.week), t = today();
  var planned = {};
  days.forEach(function (d) { planFor(d).forEach(function (e) { planned[e.rid] = 1; }); });
  var day = prepDayOf(days);
  if (day < t) day = days[days.length - 1] < t ? day : t;        // prep day already passed this week: today
  var adds = S.recipes.filter(function (r) { return r.freq === 'weekly' && !planned[r.id]; }).map(function (r) {
    return { id: newId('p_'), date: day, rid: r.id, title: r.title, servings: defaultPlanServings(r), meals: isBatchable(r) ? (+S.settings.prepMeals || 5) : 1 };
  });
  if (!adds.length) { toast(regularsCount() ? 'Your regulars are already planned this week' : 'Mark recipes "Every week" on their page first'); return; }
  adds.forEach(function (e) { queue({ op: 'plan', entry: e }); });
  render();
  toast('Planned ' + adds.length + (adds.length === 1 ? ' regular' : ' regulars') + ' for ' + DAY_NAMES[parseDay(day).getDay()], function () {
    adds.forEach(function (e) { queue({ op: 'unplan', id: e.id }); }); render();
  });
}
function regularsCount() { return S.recipes.filter(function (r) { return r.freq === 'weekly'; }).length; }

/** Copy last week's plan onto this one, same days. */
function repeatLastWeek() {
  var from = weekDays(UI.week - 1), to = weekDays(UI.week), adds = [];
  from.forEach(function (d, i) {
    planFor(d).forEach(function (e) {
      if (planFor(to[i]).some(function (x) { return x.rid === e.rid; })) return;
      adds.push({ id: newId('p_'), date: to[i], rid: e.rid, title: e.title, servings: e.servings, meals: entryMeals(e) });
    });
  });
  if (!adds.length) { toast(from.some(function (d) { return planFor(d).length; }) ? 'Everything from last week is already here' : 'Nothing was planned the week before'); return; }
  adds.forEach(function (e) { queue({ op: 'plan', entry: e }); });
  render();
  toast('Copied ' + adds.length + (adds.length === 1 ? ' meal' : ' meals') + ' from the week before', function () {
    adds.forEach(function (e) { queue({ op: 'unplan', id: e.id }); }); render();
  });
}

/* ---------- the fridge: leftovers and prepped meals ---------- */
function fridgeSorted() {
  return S.fridge.slice().sort(function (a, b) { return (a.frozen ? 1 : 0) - (b.frozen ? 1 : 0) || String(a.until || '9').localeCompare(String(b.until || '9')); });
}
function portionWord(it, n) {
  var r = it.rid ? byId(it.rid) : null;
  if (r && r.servings && !isPeople(r)) return unitWord(r.unit, n);
  return n === 1 ? 'meal' : 'meals';
}
function eatByText(it) {
  if (!it.until) return it.frozen ? 'Frozen' : '';
  var n = daysUntil(it.until), d = parseDay(it.until);
  if (it.frozen) return 'Frozen, use by ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
  if (n < 0) return 'Past its eat-by date';
  if (n === 0) return 'Eat today';
  if (n === 1) return 'Eat by tomorrow';

}
function fridgeUrgent(it) { return !it.frozen && it.until && daysUntil(it.until) <= 1; }

function fridgeCardHtml() {

  }).join('') + '</ul></section>';
  return h;

/** After "Made it": offer to track the leftovers or the prepped meals. */
function afterMade(r, planEntry) {
  var f = scaleFor(r), portions = 0;
  if (!planEntry) {
    var week = weekDays(0), t = today();
    S.plan.forEach(function (e) {
      if (e.rid === r.id && entryMeals(e) > 1 && week.indexOf(e.date) >= 0 && e.date <= t && (!planEntry || e.date > planEntry.date)) planEntry = e;
    });
  }
  if (planEntry && entryMeals(planEntry) > 1) portions = entryMeals(planEntry);
  else if (isBatchable(r)) {
    var cf = +S.settings.cookFor || 0, total = r.servings * f;
    if (cf && total >= cf * 2) portions = Math.floor(total / cf + 0.01) - 1;
  } else if (r.servings && r.keeps) portions = Math.round(r.servings * f);
  if (portions < 1) return false;
  openLeftovers({ id: newId('f_'), name: r.title, rid: r.id, portions: portions, made: today(), until: addDays(today(), +r.keeps || +S.settings.keepDays || 4), frozen: false }, true);
  return true;
}

function openLeftovers(item, isNew) {

/* ---------- prep session: everything cooking on prep day, in one place ---------- */

}

      '<span class="btnrow"><button class="btn sm" data-act="cook" data-id="' + esc(x.r.id) + '" data-f="' + f + '">' + icon('flame') + 'Cook mode</button>' +

    }).join('') + '</ul>';

}

/* ---------- review before adding a recipe's (or a week's) ingredients ---------- */
function openReview(sources, title) {

  buildReviewItems();

function buildReviewItems() {
  var rv = UI.review, prev = rv.on;

function reviewLabel() { var n = UI.review.items.filter(function (it) { return UI.review.on[it.key]; }).length; return 'Add ' + n + (n === 1 ? ' item' : ' items'); }

  } else {

  }

/* ===================== pantry, prices and what things cost ===================== */
var PANTRY_STATUS = [['have', 'Have'], ['low', 'Low'], ['out', 'Out']];
var KEEPS_SECTIONS = ['Pasta, rice & grains', 'Canned & jarred', 'Sauces & condiments', 'Spices & seasonings', 'Baking', 'Oils & vinegar', 'Frozen', 'Snacks & drinks'];
var PANTRY_STARTERS = ['Rice', 'Pasta', 'Flour', 'Sugar', 'Brown sugar', 'Soy sauce', 'Fish sauce', 'Olive oil', 'Eggs', 'Butter', 'Garlic', 'Onions', 'Chicken broth', 'Parmesan', 'Italian seasoning', 'Red pepper flakes'];

/** "chicken" you have covers "chicken thighs" in a recipe, but "garlic" doesn't cover "garlic powder". */
function haveMatch(h, k) {
  if (!h || !k) return false;
  if (h === k) return true;
  var pk = ' ' + k + ' ', ph = ' ' + h + ' ';
  var at = pk.indexOf(ph);
  if (at >= 0) {
    var next = pk.slice(at + ph.length).trim().split(' ')[0];
    return !(next && TAILS[next]);
  }
  return ph.indexOf(pk) >= 0;
}
function pantryFind(name) {
  var k = itemKey(name), best = null;
  S.pantry.forEach(function (p) { var pk = itemKey(p.name); if (pk === k) best = p; else if (!best && haveMatch(pk, k)) best = p; });
  return best;
}
function pantryHas(name) { var p = pantryFind(name); return !!(p && p.status !== 'out'); }
function inPantryToSkip(name) { var p = pantryFind(name); return !!(p && p.status === 'have'); }

/* ---------- prices ---------- */
function priceFind(name) {
  var k = itemKey(name), best = null;
  S.prices.forEach(function (p) { var pk = itemKey(p.name); if (pk === k) best = p; else if (!best && haveMatch(pk, k)) best = p; });
  return best;
}
function money(v) { return '$' + (v >= 100 ? Math.round(v) : v.toFixed(2)); }
function parseMoney(s) { var m = String(s || '').replace(/[$,\s]/g, '').match(/^\d*\.?\d+$/); return m ? +m[0] : 0; }

/** What an amount of something costs, from what you last paid. null when we can't tell. */
function costOf(name, parts) {
  var p = priceFind(name);
  if (!p || !(+p.price > 0)) return null;
  var paid = sumParts(parseAmount(p.amount));
  var need = sumParts(parts);
  if (!need.length) return null;
  if (!paid.length) return null;
  if (need.length === 1 && paid.length === 1) {
    var a = need[0], b = paid[0], ca = unitClass(a.u), cb = unitClass(b.u);
    if (ca === cb && ca === 'vol') return p.price * (a.v * VOL[a.u]) / (b.v * VOL[b.u]);
    if (ca === cb && ca === 'wt') return p.price * (a.v * WT[a.u]) / (b.v * WT[b.u]);
    if (ca === cb) return p.price * a.v / b.v;
  }
  var food = foodFor(name);
  var gNeed = partsGrams(need, food, name), gPaid = partsGrams(paid, food, p.name);
  if (gNeed && gPaid) return p.price * gNeed / gPaid;
  return null;
}
function recipeCost(r) {
  CACHE.cost = CACHE.cost || {};
  if (CACHE.cost[r.id]) return CACHE.cost[r.id];
  var total = 0, used = 0, all = 0;
  String(r.ingredients || '').split(/\r?\n/).forEach(function (line) {
    buyItems(line, 1).forEach(function (it) {
      var food = foodFor(it.name);
      if (food && food.free) return;          // salt, water, spices: pennies
      all++;
      var c = costOf(it.name, it.parts);
      if (c !== null) { used++; total += c; }
    });
  });
  return (CACHE.cost[r.id] = { total: total, used: used, all: all });
}
/** Rough cost of what's still to buy. */
function listEstimate() {
  var sum = 0, n = 0, all = 0;
  S.shop.forEach(function (it) {
    if (it.checked) return;
    all++;
    var p = priceFind(it.name); if (!p || !(+p.price > 0)) return;
    var c = it.amount ? costOf(it.name, parseAmount(it.amount)) : null;
    sum += c !== null ? c : +p.price; n++;
  });
  return { sum: sum, n: n, all: all };
}
function weekKey(offset) { return weekDays(offset || 0)[0]; }
function spendSummary() {
  var sp = S.settings.spend || {}, now = sp[weekKey(0)] || 0;
  var prev = [1, 2, 3, 4].map(function (i) { return sp[weekKey(-i)]; }).filter(function (v) { return v > 0; });
  var avg = prev.length ? prev.reduce(function (a, b) { return a + b; }, 0) / prev.length : 0;
  return { now: now, avg: avg, weeks: prev.length };
}

function finishShopping() {
  var d = UI.done; if (!d) return;
  var bought = d.ids.map(function (id) { return byIdIn(S.shop, id); }).filter(Boolean);
  var priceRows = [], pantryRows = [], sum = 0;
  bought.forEach(function (it) {
    var el = $('#dp-' + it.id), v = el ? parseMoney(el.value) : 0;
    if (v > 0) {
      sum += v;
      var ex = S.prices.filter(function (p) { return itemKey(p.name) === itemKey(it.name); })[0];
      priceRows.push({ id: ex ? ex.id : newId('$_'), name: it.name, price: v, amount: it.amount || '', date: today() });
    }
    if (d.pantry[it.id]) {
      var pe = S.pantry.filter(function (p) { return itemKey(p.name) === itemKey(it.name); })[0];
      if (pe) { var u = clone(pe); u.status = 'have'; u.useBy = ''; pantryRows.push(u); }
      else pantryRows.push({ id: newId('y_'), name: it.name, section: it.section || sectionFor(it.name), status: 'have', useBy: '' });
    }
  });
  var total = parseMoney(($('#done-total') || {}).value) || sum;
  closeSheet(true);
  var undos = [];
  if (priceRows.length) undos.push(tableQueue('prices', priceRows, []));
  if (pantryRows.length) undos.push(tableQueue('pantry', pantryRows, []));
  var spendBefore = clone(S.settings.spend || {});
  if (total > 0) {
    var sp = clone(S.settings.spend || {}), k = weekKey(0);
    sp[k] = Math.round(((sp[k] || 0) + total) * 100) / 100;
    Object.keys(sp).sort().slice(0, -26).forEach(function (old) { delete sp[old]; });     // keep half a year
    setSetting('spend', sp);
  }
  var gone = bought.map(clone);
  queue({ op: 'shop', items: [], del: d.ids.slice() });
  UI.done = null;
  render();
  var msg = 'Cleared ' + gone.length + (gone.length === 1 ? ' item' : ' items') + (total > 0 ? ', ' + money(total) + ' spent' : '') + (pantryRows.length ? ', ' + pantryRows.length + ' in your pantry' : '');
  toast(msg, function () {
    undos.forEach(function (u) { u(); });

}

/* ===================== Discover: what you like, and what to try next ===================== */
/** How much each recipe says about your taste: made often and lately, favorited, rated well. */
function recipeWeight(r) {
  var made = S.cooked.filter(function (c) { return c.rid === r.id && daysAgo(c.date) <= 180; }).length;
  var w = 1 + Math.min(made, 10) * 1.5 + (r.fav ? 3 : 0) + (r.rating ? (r.rating - 3) * 1.5 : 0) + (r.freq === 'weekly' ? 3 : r.freq === 'sometimes' ? 1 : 0);
  return Math.max(0.25, w);
}
function tasteProfile() {
  if (CACHE.taste) return CACHE.taste;
  var groups = { 'Meal': {}, 'Main ingredient': {}, 'Cuisine': {} }, flav = {}, total = 0;
  S.recipes.forEach(function (r) {
    var w = recipeWeight(r); total += w;
    r.tags.forEach(function (t) { var g = tagGroup(t); if (groups[g]) { var k = t.toLowerCase(); groups[g][k] = (groups[g][k] || 0) + w; } });
    var seen = {};
    String(r.ingredients).split(/\r?\n/).forEach(function (l) {
      buyItems(l, 1).forEach(function (it) {
        var f = foodFor(it.name), k = itemKey(it.name);
        if (!k || seen[k] || isStaple(it.name) || (f && f.free && !/powder|paprika|seasoning|cumin|oregano|cinnamon|flake/.test(k))) return;
        if (/^(water|sugar|flour|oil|salt|butter|egg|milk|pepper|onion|yellow onion|white onion)$/.test(k) || sectionFor(it.name) === 'Meat & seafood') return;
        seen[k] = 1; flav[k] = { n: (flav[k] ? flav[k].n : 0) + w, name: it.name.toLowerCase() };
      });
    });
  });
  function top(obj, n) { return Object.keys(obj).sort(function (a, b) { return obj[b] - obj[a]; }).slice(0, n).map(function (k) { return { k: k, w: obj[k] }; }); }
  var out = { total: total, meal: top(groups['Meal'], 3), main: top(groups['Main ingredient'], 5), cuisine: top(groups['Cuisine'], 5), groups: groups,
    flavors: Object.keys(flav).sort(function (a, b) { return flav[b].n - flav[a].n; }).filter(function (k, i, all) {
      return !all.slice(0, i).some(function (o) { return (' ' + k + ' ').indexOf(' ' + o + ' ') >= 0; });      // "garlic powder" after "garlic"
    }).slice(0, 8).map(function (k) { return flav[k].name; }) };
  return (CACHE.taste = out);
}
function haveIdea(idea) {
  var k = norm(idea.n).replace(/\(.*\)/, '').trim();

}
function ideaPool() {

}
function ideaScore(i, tp, mode) {

}

/* ---------- the posts, kept on this phone for a few hours ---------- */
function feedsLoad() {

/* ---------- following and unfollowing ---------- */

/* ===================== sharing a recipe ===================== */
function recipeText(r) {
  var lines = [r.title];
  var meta = [];
  if (r.servings) meta.push(servingsText(r, 1));
  if (totalTime(r)) meta.push(minutes(totalTime(r)));
  if (meta.length) lines.push(meta.join(', '));
  lines.push('', 'Ingredients');
  ingredientRows(r.ingredients, 1, false).forEach(function (x) { lines.push(x.h ? '' + x.text + ':' : '- ' + (x.amt ? x.amt + ' ' : '') + x.rest); });
  var steps = stepRows(r.steps);
  if (steps.length) {
    lines.push('', 'Steps');
    steps.forEach(function (s) {
      if (s.h) { lines.push(s.h + ':'); return; }
      lines.push(s.n + '. ' + prettyFractions(s.text));
      s.subs.forEach(function (x) { lines.push('   - ' + prettyFractions(x)); });
    });
  }
  if (r.notes) lines.push('', 'Notes', prettyFractions(r.notes));
  if (r.source && /^https?:/.test(r.source) && !/docs\.google\.com/.test(r.source)) lines.push('', 'Source: ' + r.source);
  return lines.join('\n');
}

/* ---------- links: the whole recipe travels inside the link, nothing is uploaded ---------- */
function packRecipe(r) {
  var o = { t: r.title, s: r.servings || '', u: r.unit || '', p: r.prep || '', c: r.cook || '', g: r.tags, i: r.ingredients, st: r.steps, n: r.notes,
    src: /docs\.google\.com/.test(r.source) ? '' : r.source, ph: /^https?:/.test(r.photo) ? r.photo : '' };
  var json = JSON.stringify(o);
  var bytes = new TextEncoder().encode(json);
  if (window.CompressionStream) {
    var cs = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Response(cs).arrayBuffer().then(function (buf) { return 'z' + b64url(new Uint8Array(buf)); });
  }
  return Promise.resolve('j' + b64url(bytes));
}
function unpackRecipe(code) {
  var kind = code.charAt(0), bytes = unb64url(code.slice(1));
  var toObj = function (buf) { return JSON.parse(new TextDecoder().decode(buf)); };
  if (kind === 'j') return Promise.resolve(toObj(bytes));
  var ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(ds).arrayBuffer().then(function (buf) { return toObj(new Uint8Array(buf)); });
}
function b64url(u8) { var s = ''; for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function unb64url(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

function shareLink(r) {

    var url = location.origin + location.pathname + '#r=' + code;

var SHEET = null;
function openSheet(id, title, bodyHtml, footHtml, opts) {
  closeSheet(true);
  opts = opts || {};
  var scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.setAttribute('data-act', 'sheet-scrim');
  var el = document.createElement('div');
  el.className = 'sheet' + (opts.full ? ' full' : '');
  el.id = 'sheet-' + id;
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-label', title);
  el.innerHTML = '<div class="grab"><span></span></div><div class="sh-h"><h2>' + esc(title) + '</h2>' +
    '<button class="iconbtn" data-act="sheet-close" aria-label="Close">' + icon('x') + '</button></div>' +
    '<div class="sh-b">' + bodyHtml + '</div>' + (footHtml ? '<div class="sh-f">' + footHtml + '</div>' : '');
  document.body.appendChild(scrim);
  document.body.appendChild(el);
  document.body.classList.add('locked');
  SHEET = { id: id, el: el, scrim: scrim, onClose: opts.onClose || null, dirty: opts.dirty || null, autosave: opts.autosave || null };
  el.offsetHeight;                     // let the browser lay it out before animating
  scrim.classList.add('in'); el.classList.add('in');
  enableSwipe(el);
  return el;
}

function closeSheet(instant, skipCheck) {
  if (!SHEET) return;
  var s = SHEET;
  if (!skipCheck && s.autosave && s.autosave()) { SHEET = null; finishClose(s, instant); return; }
  if (!skipCheck && s.dirty && s.dirty()) { var draft = s.dirty(); SHEET = null; finishClose(s, instant); discardToast(draft); return; }
  SHEET = null;
  finishClose(s, instant);
}
function finishClose(s, instant) {
  if (s.onClose) s.onClose();
  document.body.classList.remove('locked');
  if (instant) { s.el.remove(); s.scrim.remove(); return; }
  s.el.classList.remove('in'); s.scrim.classList.remove('in');
  setTimeout(function () { s.el.remove(); s.scrim.remove(); }, 260);
}

/** swipe down on the handle or title to close, or pull the body down when it's scrolled to the top */
function enableSwipe(el) {
  var body = $('.sh-b', el);
  if (body) pullToClose(body, {
    scroller: function () { return body; },
    target: function () { return el; },
    translate: function (dy) { return 'translateY(' + dy + 'px)'; },
    close: function () { el.style.transform = ''; closeSheet(); }
  });
  var y0 = 0, dy = 0, on = false;
  function start(e) { if (isWide()) return; on = true; y0 = e.touches[0].clientY; dy = 0; el.style.transition = 'none'; }
  function move(e) { if (!on) return; dy = Math.max(0, e.touches[0].clientY - y0); el.style.transform = 'translateY(' + dy + 'px)'; e.preventDefault(); }
  function end() {
    if (!on) return; on = false; el.style.transition = ''; el.style.transform = '';
    if (dy > 90) closeSheet();
  }
  [$('.grab', el), $('.sh-h', el)].forEach(function (h) {
    if (!h) return;
    h.addEventListener('touchstart', start, { passive: true });
    h.addEventListener('touchmove', move, { passive: false });
    h.addEventListener('touchend', end);
  });
}

/** "1 hr 30 min", "1:30", "90", "2h", "1.5 hours" → minutes */
function parseDur(s) {
  s = String(s || '').trim().toLowerCase();
  if (!s) return '';
  var m = s.match(/^(\d+):(\d{1,2})$/);
  if (m) return (+m[1]) * 60 + (+m[2]) || '';
  if (/^\d+(\.\d+)?$/.test(s)) return Math.round(+s) || '';
  var h = s.match(/(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours)\b/), mi = s.match(/(\d+)\s*(m|min|mins|minute|minutes)\b/);
  var t = (h ? Math.round(+h[1] * 60) : 0) + (mi ? +mi[1] : 0);
  if (!h && !mi) { var only = s.match(/(\d+)/); return only ? +only[1] : ''; }
  return t || '';
}

/** Shrink a phone photo before saving (big photos upload slowly and fill storage). */
function shrinkPhoto(file, cb) {
  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function () {
    var max = 1200, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
    var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cb(cv.toDataURL('image/jpeg', 0.74));
  };
  img.onerror = function () { URL.revokeObjectURL(url); toast('That photo couldn\'t be opened'); };
  img.src = url;
}

/* ===================== adding a recipe from anywhere ===================== */
// Every way of adding a recipe (a link, photos, a file, pasted text) ends in addImported(), which saves it
// right away. If you close the editor while it's still working, the recipe is still saved when it's done.

var IMPORT_SEQ = 0;
/** Remember which editor an import was started from, so the result goes to the right place. */
function importTicket() { return { n: ++IMPORT_SEQ, form: FORM && FORM.isNew ? FORM.id : '' }; }
function ticketOpen(t) { return !!(t && t.form && FORM && FORM.id === t.form && SHEET && SHEET.id === 'edit' && $('#f-title')); }

/** Links are "the same recipe" if they match without the https://, www., tracking bits and trailing slash. */
function linkKey(u) {
  u = String(u || '').trim().toLowerCase();
  if (!/^https?:\/\//.test(u)) return '';
  u = u.replace(/^https?:\/\/(www\.|m\.)?/, '').replace(/#.*$/, '');
  u = u.replace(/([?&])(utm_[a-z]+|fbclid|gclid|mc_[a-z]+|ref|src)=[^&]*/g, '$1').replace(/[?&]+$/, '').replace(/\?&+/, '?');
  return u.replace(/\/+$/, '');
}
function findBySource(url) {
  var k = linkKey(url);
  if (!k) return null;
  return S.recipes.filter(function (r) { return linkKey(r.source) === k; })[0] || null;
}

/** "grandmas_lasagna-v2.pdf" → "Grandmas Lasagna V2" */
function fileTitle(name) {
  return titleCase(String(name || '').replace(/\.[a-z0-9]{1,5}$/i, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim().toLowerCase());
}
function shortDate() { var d = new Date(); return ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()] + ' ' + d.getDate(); }

/**
 * Save an imported recipe. how = { from: 'allrecipes.com' | 'your photo' | 'Lasagna.pdf', fallback: 'title to use if none was found', note: 'extra line for the status' }.
 * Returns the saved recipe.
 */
function addImported(rec, how, ticket) {
  rec = Object.assign({}, rec);
  how = how || {};
  if (!String(rec.title || '').trim()) rec.title = how.fallback || ('Recipe from ' + (how.from || 'an import'));
  if (!rec.tags || !rec.tags.length) rec.tags = suggestTags(normRecipe(rec), []);
  var r;
  if (ticketOpen(ticket)) {
    fillForm(rec);
    r = commitForm(false);
    var ni = ingredientCount(r.ingredients), ns = stepCount(r.steps);
    var found = (ni || ns) ? 'Found ' + (ni ? ni + ' ingredient' + (ni === 1 ? '' : 's') : 'no ingredients') + ' and ' + (ns ? ns + ' step' + (ns === 1 ? '' : 's') : 'no steps') + '. ' : '';
    var msg = found + 'It\'s in your recipes now. Check it over below; anything you change is saved when you tap Save or close this.';
    impState(how.warn ? 'err' : 'ok', how.warn ? 'Added, needs a look' : 'Added: ' + r.title, (how.warn ? how.warn + ' ' : '') + msg, !how.warn);

  return '<div class="subset' + (open ? ' open' : '') + '"><button data-act="sset" data-k="' + key + '" aria-expanded="' + open + '">' + title + '<span class="val">' + esc(val) + '</span></button><div class="sbb">' + (open ? body() : '') + '</div></div>';
}
function seg(setting, options) {
  return '<div class="seg" role="group">' + options.map(function (o) {
    return '<button data-act="set" data-k="' + setting + '" data-v="' + o[0] + '" aria-pressed="' + (String(S.settings[setting]) === String(o[0])) + '">' + o[1] + '</button>';
  }).join('') + '</div>';
}
function toggleRow(setting, label, hint) {
  var on = !!S.settings[setting];

/* ---------- backup file ---------- */
function exportBackup() {
  var data = { app: 'Sunday Table', version: APP_VERSION, saved: new Date().toISOString(), recipes: S.recipes, cooked: S.cooked, plan: S.plan, shop: S.shop, pantry: S.pantry, fridge: S.fridge, prices: S.prices, settings: S.settings };
  var name = (S.settings.appName || 'Sunday Table').replace(/[^\w -]/g, '') + ' backup ' + today() + '.json';
  var blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  try {
    var file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(function () { });
      return;
    }
  } catch (e) { }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Backup file saved');
}

function restoreBackup(file) {
  var fr = new FileReader();
  fr.onload = function () {
    var data;
    try { data = JSON.parse(fr.result); } catch (e) { toast('That file isn\'t a backup from this app'); return; }
    if (!data || !Array.isArray(data.recipes)) { toast('That file isn\'t a backup from this app'); return; }
    var before = { recipes: clone(S.recipes), cooked: clone(S.cooked) };
    var incoming = data.recipes.map(normRecipe), inIds = {};
    incoming.forEach(function (r) { inIds[r.id] = 1; });
    var ops = [];
    S.recipes.forEach(function (r) { if (!inIds[r.id]) ops.push({ op: 'delete', id: r.id }); });
    incoming.forEach(function (r) { ops.push({ op: 'upsert', recipe: r }); });
    var cookedIn = (data.cooked || []).filter(function (c) { return c && c.id && c.rid; }), cIds = {};
    cookedIn.forEach(function (c) { cIds[c.id] = 1; });
    S.cooked.forEach(function (c) { if (!cIds[c.id]) ops.push({ op: 'uncook', id: c.id }); });
    cookedIn.forEach(function (c) { ops.push({ op: 'cook', entry: c }); });
    queueMany(ops);
    render(); refreshSettings();
    toast('Restored ' + incoming.length + ' recipes', function () {
      var undo = [], nowIds = {};
      before.recipes.forEach(function (r) { nowIds[r.id] = 1; undo.push({ op: 'upsert', recipe: r }); });
      S.recipes.forEach(function (r) { if (!nowIds[r.id]) undo.push({ op: 'delete', id: r.id }); });
      var bc = {}; before.cooked.forEach(function (c) { bc[c.id] = 1; undo.push({ op: 'cook', entry: c }); });
      S.cooked.forEach(function (c) { if (!bc[c.id]) undo.push({ op: 'uncook', id: c.id }); });
      queueMany(undo); render();
    });
  };
  fr.readAsText(file);
}

function iconLink() {
  var u = location.origin + location.pathname + '?icon=' + encodeURIComponent(S.settings.icon) + '&pal=' + encodeURIComponent(S.settings.palette) + '&name=' + encodeURIComponent(S.settings.appName);
  var done = function () { toast('Link copied. Open it in Safari to add to your home screen.'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done, function () { prompt('Copy this link:', u); });
  else prompt('Copy this link:', u);
}

/* ===================== cook mode ===================== */
var WAKE = null;
/** A recipe's steps for cook mode, each remembering its section and recipe. */
function cookSteps(r) {
  var sec = '', out = [];
  stepRows(r.steps).forEach(function (s) { if (s.h) sec = s.h; else out.push({ s: s, sec: sec, rid: r.id }); });
  return out;
}
/** Cook one recipe, or two at once (id2): their steps woven together so both are ready about the same time. */
function openCook(id, id2) {
  var r = byId(id); if (!r) return;
  var two = id2 && id2 !== id && byId(id2) ? byId(id2) : null;
  var plan = two ? cookPlan(r, two) : null;
  UI.cook = { id: id, ids: two ? [id, two.id] : [id], i: 0, steps: plan ? plan.steps : cookSteps(r), ings: false, plan: plan };
  var el = $('#cook');
  if (!el) {
    el = document.createElement('div');
    el.className = 'cook'; el.id = 'cook';
    el.setAttribute('role', 'dialog');
    document.body.appendChild(el);
  }
  el.setAttribute('aria-label', 'Cook mode: ' + (two ? r.title + ' and ' + two.title : r.title));
  document.body.classList.add('locked', 'cooking');
  renderCook();
  if (S.settings.wake) keepAwake();
  if (!UI.cook.steps.length) { UI.cook.ings = true; renderCook(); }
}

/* ---------- two recipes at once ---------- */
// steps you start and then leave alone ("bake 25 minutes", "simmer 20 minutes"): the time to do the other recipe
var PASSIVE_RE = /\b(bake|bakes|baking|roast|roasting|simmer|simmering|rest|resting|chill|chilling|refrigerate|marinate|marinating|rise|proof|soak|soaking|cool|cooling|freeze|slow[- ]cook|pressure[- ]cook|let\b[^.]{0,30}\b(sit|stand|rest|cool|rise|marinate|simmer|cook))/i;
var WAIT_VERB = { bake: 'bakes', baking: 'bakes', bakes: 'bakes', roast: 'roasts', roasting: 'roasts', simmer: 'simmers', simmering: 'simmers', rest: 'rests', resting: 'rests', chill: 'chills', chilling: 'chills', refrigerate: 'chills',
  marinate: 'marinates', marinating: 'marinates', rise: 'rises', proof: 'rises', soak: 'soaks', soaking: 'soaks', cool: 'cools', cooling: 'cools', freeze: 'freezes' };
/** About how long a step takes, and whether it's hands-off. */
function stepTime(text) {
  var mins = 0;
  timerPieces(text).forEach(function (p) { if (p.sec) mins = Math.max(mins, p.sec / 60); });
  var m = String(text).match(PASSIVE_RE);
  var passive = !!m && mins >= 8;
  if (!mins) mins = Math.min(8, Math.max(2, Math.round(String(text).length / 45)));   // a few minutes of chopping and stirring
  return { mins: mins, passive: passive, verb: m ? (WAIT_VERB[m[1].toLowerCase()] || (m[3] ? m[3].toLowerCase() + 's' : 'cooks')) : '' };
}
/**
 * Weave two recipes into one list of steps. The longer one starts first; the other joins so they finish together,
 * and its steps fill the hands-off waits ("while the chicken bakes…").
 */
function cookPlan(a, b) {
  var tracks = [a, b].map(function (r) {
    var st = cookSteps(r).map(function (x) {
      var t = stepTime(x.s.text + ' ' + x.s.subs.join(' '));
      x.mins = t.mins; x.passive = t.passive; x.verb = t.verb;
      return x;
    });
    var total = st.reduce(function (n, x) { return n + x.mins; }, 0);
    return { r: r, steps: st, k: 0, ready: 0, total: total, left: total, wait: '' };
  });
  var lead = tracks[0].total >= tracks[1].total ? tracks[0] : tracks[1], other = lead === tracks[0] ? tracks[1] : tracks[0];
  lead.startAt = 0;
  other.startAt = Math.max(0, lead.total - other.total);
  var t = 0, out = [], guard = 0, last = null;
  while (tracks.some(function (x) { return x.k < x.steps.length; }) && guard++ < 500) {
    var open = tracks.filter(function (x) { return x.k < x.steps.length; });
    var can = open.filter(function (x) { return x.ready <= t && x.startAt <= t; });
    if (!can.length) {
      // nothing to do this minute: skip ahead to when the next step can start
      t = Math.min.apply(null, open.map(function (x) { return Math.max(x.ready, x.startAt); }));
      continue;
    }
    can.sort(function (p, q) { return q.left - p.left; });
    var tr = can[0];
    // stay with the same recipe while it can carry on, unless the other one has fallen well behind (no back-and-forth every step)
    if (last && can.indexOf(last) >= 0) { var alt = can.filter(function (x) { return x !== last; })[0]; if (!alt || alt.left <= last.left + 5) tr = last; }
    last = tr;
    var st = tr.steps[tr.k++], ot = tr === tracks[0] ? tracks[1] : tracks[0];
    st.at = Math.round(t);
    st.during = ot.k < ot.steps.length || ot.ready > t ? (ot.ready > t && ot.wait ? ot.wait : '') : '';
    if (st.passive) { tr.ready = t + st.mins; tr.wait = 'While ' + tr.r.title + ' ' + (st.verb || 'cooks'); t += 1; }
    else { t += st.mins; tr.ready = t; tr.wait = ''; }
    tr.left -= st.mins;
    out.push(st);
  }
  var end = Math.max(t, tracks[0].ready, tracks[1].ready);
  return { steps: out, total: Math.round(end), apart: Math.round(tracks[0].total + tracks[1].total), names: [a.title, b.title] };
}
function minsText(m) { m = Math.max(1, Math.round(m)); return m >= 60 ? Math.floor(m / 60) + ' hr' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : m + ' min'; }

function renderCook() {
  var el = $('#cook'); if (!el || !UI.cook) return;
  var c = UI.cook, n = c.steps.length, cur = c.steps[c.i], two = c.ids.length > 1;
  var r = byId(cur ? cur.rid : c.id) || byId(c.id); if (!r) { closeCook(); return; }
  themeEl(el, r);
  var metric = S.settings.units === 'metric';
  var rowsFor = function (rr) { return ingredientRows(rr.ingredients, scaleFor(rr), metric); };
  var ings = rowsFor(r);
  var title = two ? c.ids.map(function (id) { var x = byId(id); return x ? x.title : ''; }).join(' + ') : r.title;
  var h = '<div class="ctop"><button class="iconbtn" data-act="cookclose" aria-label="Leave cook mode">' + icon('x') + '</button>' +
    '<span class="t">' + esc(title) + '</span>' +
    '<button class="btn sm" data-act="cooking" style="background:transparent;color:inherit;border-color:rgba(255,255,255,.35)">' + icon('ings') + (c.ings ? 'Steps' : 'Ingredients') + '</button></div>' +
    '<div class="prog"><i style="width:' + (n ? ((c.i + 1) / n * 100) : 0) + '%"></i></div>';
  h += '<div class="cbody" id="cbody"><div class="cin">';
  if (two && c.i === 0 && c.plan) {
    var saved = c.plan.apart - c.plan.total;
    h += '<div class="twoplan"><b>Cooking two at once.</b> Both should be ready in about ' + esc(minsText(c.plan.total)) +

/** Log a "Made it" for today, remembering how many people it was for. */
function logMade(r) {
  var f = scaleFor(r);
  var entry = { id: newId('c_'), rid: r.id, date: today(), title: r.title, note: '', servings: r.servings && isPeople(r) ? Math.round(r.servings * f * 100) / 100 : '' };
  queue({ op: 'cook', entry: entry });
  render();
  toast('Logged ' + r.title + ' for today', function () { queue({ op: 'uncook', id: entry.id }); render(); });
  return entry;
}

function bulkCol(name) {
  var undo = [];
  Object.keys(UI.sel).forEach(function (id) {
    var r = byId(id); if (!r || r.cols.indexOf(name) >= 0) return;
    undo.push({ op: 'upsert', recipe: clone(r) }); var n = clone(r); n.cols.push(name); queue({ op: 'upsert', recipe: n });
  });
  endSelect();
  toast('Added ' + undo.length + ' to ' + name, function () { queueMany(undo); render(); });
}

function toggleTag(k) {
  var i = UI.filters.tags.indexOf(k);
  if (i >= 0) UI.filters.tags.splice(i, 1); else UI.filters.tags.push(k);
}
function endSelect() { UI.selecting = false; UI.sel = {}; render(); }

  if (tab === 'add') { ACTIONS.add(); return; }
  if (tab !== UI.tab) { UI.col = ''; UI.week = 0; }
  if (tab !== UI.tab && !keepFilters) { UI.filters = blankFilters(); UI.q = ''; UI.selecting = false; UI.sel = {}; }
  if (tab === UI.tab && !keepFilters) { window.scrollTo(0, 0); $('#listpane').scrollTop = 0; }
  var changed = tab !== UI.tab;
  UI.tab = tab;
  render();
  if (changed) { var lp = $('#listpane'); if (lp) { lp.classList.remove('pane-in'); void lp.offsetWidth; lp.classList.add('pane-in'); } }
}

var IMPORTING = false;
function doImport() {
  var url = ($('#f-link').value || '').trim();
  if (IMPORTING) return;
  var dup = findBySource(url);
  if (dup && !(FORM && FORM.id === dup.id)) { alreadyHave(dup); return; }
  IMPORTING = true;
  var ticket = importTicket();
  var b = $('#importbtn'); b.disabled = true; b.textContent = 'Importing…';
  var host = (String(url).match(/^https?:\/\/(?:www\.)?([^\/?#]+)/i) || [])[1] || 'the link';
  impState('busy', 'Importing…', 'Getting the recipe from ' + host + '…');
  importLink(url).then(function (res) {
    IMPORTING = false;
    var btn = $('#importbtn'); if (btn) { btn.disabled = false; btn.textContent = 'Import'; }
    if (!res.ok) {
      importFailed(ticket, 'Didn\'t work', res.error);
      if (ticketOpen(ticket) && /paste/i.test(res.error)) $('#pastewrap').open = true;
      return;
    }
    var rec = res.recipe;
    if (!rec.source) rec.source = url;
    var d2 = findBySource(rec.source) || findBySource(url);
    if (d2 && !(FORM && FORM.id === d2.id && ticketOpen(ticket))) { if (ticketOpen(ticket)) alreadyHave(d2); else toast('"' + d2.title + '" is already in your recipes'); return; }
    addImported(rec, { from: host, fallback: 'Recipe from ' + host }, ticket);
  });
}
function alreadyHave(r) {
  impState('ok', 'Already in your recipes', '');
  var m = $('#importmsg');
  if (m) m.innerHTML = '"' + esc(r.title) + '" is already in your recipes, so it wasn\'t added twice. <button class="linkbtn" data-act="open" data-id="' + esc(r.id) + '">Open it</button>';
}

/* ===================== typing ===================== */
var NAME_T = null;
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'q') {
    UI.q = t.value; syncClearBtn();
    clearTimeout(t._t);
    t._t = setTimeout(function () { renderList(); }, 120);
  } else if (t.getAttribute('data-input') === 'appname') {
    clearTimeout(NAME_T);
    NAME_T = setTimeout(function () { setSetting('appName', t.value.trim() || 'Sunday Table'); renderHeader(); }, 600);
  } else if (t.id === 'f-link') {
    clearTimeout(t._t);
    var v = t.value.trim();
    if (/^https?:\/\/[^\s\/]+\.[^\s]{2,}$/i.test(v) && (e.inputType === 'insertFromPaste' || e.inputType === 'insertReplacementText')) {
      t._t = setTimeout(function () { if ($('#f-link') === t && t.value.trim() === v && !IMPORTING) { t.blur(); doImport(); } }, 350);
    }
  } else if (t.id === 'f-tags') {
    refreshTagUI();
  } else if (t.id === 'f-ing') {
    clearTimeout(t._t);
    t._t = setTimeout(function () { if (!$('#tagedit') || !$('#f-title')) return; refreshTagUI(); }, 500);
  } else if (t.id === 'pickq') {
    UI.pick.q = t.value; $('#picklist').innerHTML = pickListHtml();
  } else if (t.id === 'have') {
    UI.have = t.value; clearTimeout(t._t); t._t = setTimeout(renderHave, 200);
  } else if (t.getAttribute('data-input') === 'shortcut') {
    clearTimeout(NAME_T); NAME_T = setTimeout(function () { setSetting('shortcut', t.value.trim() || 'Add to Groceries'); }, 600);
  } else if (t.getAttribute('data-input') === 'staples') {
    clearTimeout(NAME_T); NAME_T = setTimeout(function () { setSetting('staples', t.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean)); }, 600);
  } else if (t.id === 'f-photourl') {
    FORM.photoUrl = t.value.trim(); FORM.photoData = '';
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'sort') { setSetting('sort', t.value); renderList(); }
  else if (t.id === 'f-photo' && t.files && t.files[0]) {
    shrinkPhoto(t.files[0], function (data) { FORM.photoData = data; FORM.removed = false; $('#photopick').innerHTML = photoPickHtml(readForm()); });
    t.value = '';
  } else if (t.id === 'importfile' && t.files && t.files[0]) { restoreBackup(t.files[0]); t.value = ''; }
  else if (t.id === 'f-ocrpick' && t.files && t.files.length) { var fl = Array.prototype.slice.call(t.files); t.value = ''; readFiles(fl); }
  else if (t.getAttribute && t.getAttribute('data-dur')) { var mins = parseDur(t.value); if (mins) t.value = minutes(mins); }
});
document.addEventListener('submit', function (e) {
  if (e.target.getAttribute('data-form') === 'addpantry') {
    e.preventDefault();
    var pin = $('#newpantry'); if (!pin.value.trim()) return;
    var pv = pin.value; pin.value = '';
    addPantry(pv); render();
    var pa = $('#newpantry'); if (pa) pa.focus();
    return;
  }
  if (e.target.getAttribute('data-form') === 'additem') {
    e.preventDefault();
    var inp = $('#newitem'), v = inp.value;
    if (!v.trim()) return;
    inp.value = '';
    addTyped(v); render();
    var again = $('#newitem'); if (again) again.focus();
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && (e.target.id === 'q' || e.target.id === 'pickq' || e.target.id === 'have')) e.target.blur();
  if (e.key === 'Enter' && e.target.id === 'f-link') { e.preventDefault(); doImport(); }
  if (e.key === 'Enter' && e.target.id === 'followurl') { e.preventDefault(); ACTIONS.follow(); }
  if (e.key === 'Enter' && e.target.id === 'bulk-tag') ACTIONS['bulk-tag-save']();
  if (e.key === 'Enter' && e.target.id === 'newcol') ACTIONS.savecol($('[data-act="savecol"]'));
  if ((e.key === 'Enter' || e.key === ',') && e.target.id === 'f-newtag') { e.preventDefault(); ACTIONS.tagnew(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('filebtn')) { e.preventDefault(); e.target.click(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('data-act') === 'stepdone') { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape') { if (UI.cook) closeCook(); else if (SHEET) closeSheet(); else if (UI.openId && !isWide()) closeDetail(); }
  if (UI.cook && !SHEET) { if (e.key === 'ArrowRight') cookGo(1); if (e.key === 'ArrowLeft') cookGo(-1); }
});

/* ===================== pull to refresh ===================== */
(function () {
  var y0 = null, dy = 0;
  function atTop() { return isWide() ? $('#listpane').scrollTop <= 0 : window.scrollY <= 0; }
  document.addEventListener('touchstart', function (e) {
    if (SHEET || UI.cook || document.body.classList.contains('show-detail')) return;
    if (!e.target.closest('#listpane') || !atTop()) return;
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    var p = $('#ptr'); if (!p) return;
    if (dy > 0 && atTop()) { p.style.transition = 'none'; p.style.height = Math.min(dy / 2, 56) + 'px'; p.textContent = dy > 110 ? 'Release to sync' : 'Pull to sync'; }
  }, { passive: true });
  document.addEventListener('touchend', function () {
    if (y0 === null) return;
    var p = $('#ptr');
    if (p) { p.style.transition = ''; p.style.height = '0'; }
    if (dy > 110) { if (connected()) { sync(); toast('Syncing with your sheet…'); } else toast('Connect your sheet in Settings to sync'); }
    y0 = null; dy = 0;
  });
})();

/* ===================== start ===================== */
function start() {
  $('#gearbtn').innerHTML = icon('gear');
  $('#tab-recipes').innerHTML = icon('book') + '<span>Recipes</span>';
  $('#tab-plan').innerHTML = icon('cal') + '<span>Plan</span>';
  $('#tab-shop').innerHTML = icon('cart') + '<span>Shopping</span>';
  $('#tab-discover').innerHTML = icon('compass') + '<span>Discover</span>';
  $('#tab-history').innerHTML = icon('hist') + '<span>History</span>';
  $('#fab').innerHTML = icon('plus');
  var hm = location.hash.match(/^#r=(.+)$/);
  if (hm) { showShared(hm[1]); return; }
  load().then(function () {
    if (URL_ICON) {
      if (URL_ICON.icon && ICONS[URL_ICON.icon]) S.settings.icon = URL_ICON.icon;
      if (URL_ICON.pal && PALETTES[URL_ICON.pal]) S.settings.palette = URL_ICON.pal;
      if (URL_ICON.name) S.settings.appName = URL_ICON.name;
      var link = $('link[rel="apple-touch-icon"]');
      if (link) link.setAttribute('href', iconData(S.settings.icon, S.settings.palette));
    }
    applyAppearance();
    loadTimers();
    if (['history', 'plan', 'shop', 'discover'].indexOf(S.settings.openTo) >= 0) UI.tab = S.settings.openTo;
    render();
    if (S.settings.openTo === 'last' && S.lastOpen && byId(S.lastOpen)) openRecipe(S.lastOpen);
    else if (isWide() && S.recipes.length && !UI.openId) openRecipe(visibleRecipes()[0].id);
    $('#app').removeAttribute('aria-busy');
    if (connected()) sync();
    setupOffline();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !S) return;
    if (connected()) sync();
    if (UI.cook && S.settings.wake && !WAKE) keepAwake();
    tick && UI.timers.length && tick();
  });
  window.addEventListener('online', function () { if (S && connected()) sync(); });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function () { if (S) applyAppearance(); };
    if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
    var wq = window.matchMedia('(min-width: 760px)'), lastWide = wq.matches;
    var onWide = function () {
      if (!S || wq.matches === lastWide) return; lastWide = wq.matches;
      if (wq.matches) { document.body.classList.remove('show-detail'); if (!UI.openId && S.recipes.length) UI.openId = visibleRecipes()[0] ? visibleRecipes()[0].id : ''; }
      else if (UI.openId) document.body.classList.add('show-detail');
      render();
    };
    if (wq.addEventListener) wq.addEventListener('change', onWide); else if (wq.addListener) wq.addListener(onWide);
  }
  enableDetailPull();
  enableEdgeBack();
  $('#detailpane').addEventListener('scroll', function () {
    var b = $('#dbar'); if (b) b.classList.toggle('scrolled', this.scrollTop > 150);
  }, { passive: true });
}
/* ===================== works offline: a copy of the app kept on this phone (sw.js) ===================== */
var OFFLINE = { reg: null, waiting: null, updating: false };
function offlineReady() { return !!(navigator.serviceWorker && navigator.serviceWorker.controller); }
function setupOffline() {
  if (!('serviceWorker' in navigator)) return;
  var testing = false; try { testing = !!localStorage.getItem('st-sw-test'); } catch (e) { }
  if (navigator.webdriver && !testing) return;                      // automated tests run without it unless they ask
  if (location.protocol !== 'https:' && location.hostname !== 'localhost') return;
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    OFFLINE.reg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
    reg.addEventListener('updatefound', function () {
      var w = reg.installing; if (!w) return;
      w.addEventListener('statechange', function () {
        if (w.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(w);
      });
    });
  }, function () { });
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (OFFLINE.updating) { OFFLINE.updating = false; location.reload(); }
    else if (SHEET && SHEET.id === 'settings') renderOfflineLine();
  });
  // home-screen apps are often resumed rather than reopened, so look for a new version then too
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && OFFLINE.reg) OFFLINE.reg.update().catch(function () { });
  });
}
function offerUpdate(w) {
  OFFLINE.waiting = w;
  if ($('#updbar')) return;
  var bar = document.createElement('div');
  bar.id = 'updbar'; bar.className = 'updbar'; bar.setAttribute('role', 'status');
  bar.innerHTML = '<span>A new version of ' + esc(S && S.settings.appName || 'Sunday Table') + ' is ready.</span><button class="btn sm primary" data-act="applyupdate">Update</button><button class="iconbtn" data-act="laterupdate" aria-label="Later">' + icon('x') + '</button>';
  document.body.appendChild(bar);
  requestAnimationFrame(function () { bar.classList.add('in'); });
}
function renderOfflineLine() { var el = $('#offline-line'); if (el) el.innerHTML = offlineLineHtml(); }
function offlineLineHtml() {
  if (!('serviceWorker' in navigator)) return 'This browser can\'t keep a copy for offline use.';
  return offlineReady() ? icon('check') + 'Saved on this ' + (isWide() ? 'iPad' : 'phone') + ': opens instantly and works without a connection.' : 'Getting ready to work offline…';
}
start();

<script>
/* read ?icon=…&pal=…&name=… early, so "Add to Home Screen" picks them up */
var URL_ICON = null, ICON_FROM_URL = false;
(function () {
  try {
    var p = new URLSearchParams(location.search);
    if (p.get('icon') || p.get('name')) {
      URL_ICON = { icon: p.get('icon'), pal: p.get('pal'), name: p.get('name') };
      ICON_FROM_URL = true;
      if (URL_ICON.name) {
        document.title = URL_ICON.name;
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', URL_ICON.name);
      }
    }
  } catch (e) {}
})();
</script>
<style>
/* ---------- tokens (palette values are set from JS) ---------- */
:root{
  --bg:#F2EADB;--p1:#FBF6EC;--p2:#E9DDC8;--b1:#DDCDB3;--b2:#C6AF8E;
  --t1:#2A1C13;--t2:#5B4433;--t3:#735C49;--ac:#AE3A1F;--acd:#F1D9CC;--bt:#FFFFFF;
  --ch:#2E1F17;--cht:#F6ECDD;--chm:#CBB59C;--ok:#2F6B3A;--bad:#A3291B;--warn:#875800;
  --fdisp:'Young Serif',Georgia,'Times New Roman',serif;
  --fbody:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',-apple-system,system-ui,sans-serif;
  --r1:10px;--r2:16px;--pad:16px;--cardpad:14px;
  --shadow:0 1px 0 rgba(60,35,15,.06),0 6px 18px -10px rgba(60,35,15,.35);
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
  --hdr:56px;--tab:60px;
  color-scheme:light;
}
html[data-scheme="dark"]{color-scheme:dark;--shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7)}
html[data-corners="sharp"]{--r1:3px;--r2:4px}
html[data-corners="round"]{--r1:16px;--r2:24px;--cardpad:18px;--pad:18px}
html[data-text="large"]{font-size:18px}
html[data-text="larger"]{font-size:20px}
html{font-size:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--ch)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font-family:var(--fbody);font-size:1rem;line-height:1.45;
  -webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;overflow-x:hidden}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:max(16px,1rem)}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:var(--ac)}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:4px}
svg.i{width:1.25rem;height:1.25rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--t3)}
.wrap{min-width:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- header & tab bar (the "shelf") ---------- */
.hdr{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--ch);color:var(--cht);
  padding:calc(var(--top) + 6px) max(var(--pad),env(safe-area-inset-right)) 8px max(var(--pad),env(safe-area-inset-left));
  display:flex;align-items:center;gap:10px;min-height:calc(var(--hdr) + var(--top))}
.hdr h1{font-family:var(--fdisp);font-weight:400;font-size:1.4rem;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.005em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:6px 10px;border-radius:999px;background:rgba(127,127,127,.18);color:var(--cht);white-space:nowrap;min-height:32px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--chm)}
.pill.ok .dot{background:#7FC48A}.pill.wait .dot{background:#E4B65A}.pill.err .dot{background:#F08A7A}
.pill.busy .dot{animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.25}}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:inherit;flex:none}
.iconbtn:active{background:rgba(127,127,127,.18)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ch);color:var(--chm);
  display:flex;justify-content:space-around;align-items:stretch;padding:4px 8px calc(var(--bot) + 4px);min-height:calc(var(--tab) + var(--bot))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;min-height:52px;max-width:160px;border-radius:12px}
.tabbar button[aria-current="page"]{color:var(--cht)}
.tabbar button[aria-current="page"] svg{stroke-width:2.4}
.tabbar .add{color:var(--cht)}
.tabbar .add span.plus{width:40px;height:32px;border-radius:12px;background:var(--ac);color:var(--bt);display:flex;align-items:center;justify-content:center}

/* ---------- layout ---------- */
.main{padding:calc(var(--hdr) + var(--top) + 4px) 0 calc(var(--tab) + var(--bot) + 24px)}
.listpane{padding:0 max(var(--pad),env(safe-area-inset-right)) 0 max(var(--pad),env(safe-area-inset-left));max-width:760px;margin:0 auto}
.detailpane{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);visibility:hidden}
body.show-detail .detailpane{transform:none;visibility:visible}
.dbar{position:sticky;top:0;z-index:2;background:var(--ch);color:var(--cht);display:flex;align-items:center;gap:4px;
  padding:calc(var(--top) + 6px) 8px 6px;min-height:calc(var(--hdr) + var(--top))}
.dbar .t{flex:1;min-width:0;font-family:var(--fdisp);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.dbar.scrolled .t{opacity:1}
.dbar .back{display:inline-flex;align-items:center;gap:2px;padding:0 10px 0 4px;height:44px;border-radius:22px;font-size:1rem}
.dbody{padding:0 max(var(--pad),env(safe-area-inset-right)) calc(var(--bot) + 40px) max(var(--pad),env(safe-area-inset-left));max-width:900px;margin:0 auto}
.empty-detail{display:none}

@media (min-width:760px){
  body{height:100vh;height:100dvh;overflow:hidden}
  .main{position:fixed;top:calc(var(--hdr) + var(--top));bottom:calc(var(--tab) + var(--bot));left:0;right:0;padding:0;display:grid;grid-template-columns:minmax(320px,38%) 1fr}
  .listpane{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-width:none;margin:0;padding:4px 16px 24px max(16px,env(safe-area-inset-left));border-right:1px solid var(--b1)}
  .detailpane{position:relative;inset:auto;transform:none;visibility:visible;z-index:1;transition:none}
  .dbar{display:none}
  .dbody{padding:20px 28px 40px}
  .empty-detail{display:flex}
}
@media (min-width:1000px){.main{grid-template-columns:400px 1fr}}

/* ---------- list ---------- */
.search{position:relative;margin:12px 0 10px;display:flex;gap:8px}
.search .box{flex:1;min-width:0;position:relative}
.search input{width:100%;height:46px;border-radius:var(--r1);border:1.5px solid var(--b1);background:var(--p1);padding:0 40px 0 40px;outline:none}
.search input:focus{border-color:var(--ac)}
.search .box>svg{position:absolute;left:12px;top:13px;color:var(--t3)}
.search .clear{position:absolute;right:2px;top:1px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--t3)}
.fbtn{height:46px;padding:0 14px;border-radius:var(--r1);border:1.5px solid var(--b1);background:var(--p1);display:inline-flex;align-items:center;gap:6px;color:var(--t2);font-weight:600;white-space:nowrap}
.fbtn.on{border-color:var(--ac);color:var(--ac)}
.fbtn .n{background:var(--ac);color:var(--bt);border-radius:999px;font-size:.75rem;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.listtools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 6px;color:var(--t3);font-size:.875rem}
.listtools select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--t2);font-weight:600;padding:8px 22px 8px 4px;min-height:40px;
  background-image:linear-gradient(45deg,transparent 50%,var(--t3) 50%),linear-gradient(135deg,var(--t3) 50%,transparent 50%);
  background-position:right 8px top 55%,right 3px top 55%;background-size:5px 5px;background-repeat:no-repeat}
.linkbtn{color:var(--ac);font-weight:600;padding:8px 4px;min-height:40px}
.banner{background:var(--acd);color:var(--t1);border-radius:var(--r1);padding:12px 14px;margin:12px 0 4px;font-size:.9rem;display:flex;gap:10px;align-items:flex-start}
.banner b{display:block}
.banner .act{margin-left:auto;flex:none}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--b1);background:var(--p1);color:var(--t2);border-radius:999px;padding:6px 12px;font-size:.875rem;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--bt)}
.chip .x{opacity:.8}

.rlist{list-style:none;margin:0;padding:0}
.rrow{display:flex;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--b1);border-radius:6px;position:relative;width:100%;text-align:left}
.rrow:active,.rrow.sel-on{background:var(--p2)}
.rrow.current{background:var(--p2)}
.rrow .info{flex:1;min-width:0}
.rrow .nm{font-family:var(--fdisp);font-size:1.14rem;line-height:1.2;overflow-wrap:anywhere;color:var(--t1)}
.rrow .sub{color:var(--t3);font-size:.85rem;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.rrow .fav{color:var(--ac);flex:none}
.rrow .selbox{width:24px;height:24px;border-radius:6px;border:2px solid var(--b2);flex:none;display:flex;align-items:center;justify-content:center}
.rrow.sel-on .selbox{background:var(--ac);border-color:var(--ac);color:var(--bt)}
.sub .tg{min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* spice-tin tiles: the one bold element */

.badge{background:var(--ac);color:var(--bt);border-radius:999px;font-size:.75rem;font-weight:700;padding:2px 9px}
.prow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--b1)}
.prow .tile{width:46px;height:46px;font-size:1.4rem}
.prow .info{flex:1;min-width:0}
.prow .nm{display:block;font-weight:700;overflow-wrap:anywhere}
.prow .sub{display:block;color:var(--t3);font-size:.85rem}
.addday{display:flex;align-items:center;gap:6px;color:var(--ac);font-weight:700;min-height:44px;width:100%}
.addday svg.i{width:1.1rem;height:1.1rem}
.shopcta{display:flex;flex-direction:column;gap:12px;margin:18px 0 8px}
.shopcta b{display:block;font-family:var(--fdisp);font-weight:400;font-size:1.2rem}
.shopcta .muted{font-size:.9rem}
.daypick{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.daypick button{border:1.5px solid var(--b1);background:var(--p1);border-radius:var(--r1);padding:10px 8px;text-align:left;min-height:64px}
.daypick b{display:block}
.daypick span{color:var(--t3);font-size:.85rem}
.daypick i{display:block;font-style:normal;color:var(--ac);font-size:.78rem;font-weight:700;margin-top:2px}

/* ---------- shopping ---------- */
.shophead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.additem{display:flex;gap:8px;margin:6px 0 10px}
.additem .inp{flex:1;min-width:0}
.shopacts{margin:4px 0 6px}
.shopacts .btn svg.i{width:1.05rem;height:1.05rem}
h3.sect{font-family:var(--fdisp);font-weight:400;font-size:1.1rem;color:var(--t2);margin:18px 0 2px}
.shoplist{list-style:none;margin:0;padding:0}
.srow{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--b1)}
.sck{display:flex;align-items:flex-start;gap:12px;flex:1;min-width:0;text-align:left;padding:10px 0}
.sck .ck{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--b2);display:flex;align-items:center;justify-content:center;color:var(--bt);margin-top:1px}
.srow.on .sck .ck,.sck[aria-pressed="true"] .ck{background:var(--ok);border-color:var(--ok)}
.sck .tx{flex:1;min-width:0}
.sck .nm{display:block;font-weight:700;overflow-wrap:anywhere}
.sck .amt{font-weight:400;color:var(--t2)}
.sck .from{display:block;font-size:.8rem;color:var(--t3);overflow-wrap:anywhere}
.srow.on .nm{text-decoration:line-through;color:var(--t3)}
.srow.off .nm{color:var(--t3)}
.sedit{color:var(--t3)}
.incart{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:10px}
.howto{padding-left:1.2rem}
.howto li{margin:6px 0}

/* ---------- share ---------- */
.sharelist{display:flex;flex-direction:column;gap:8px}
.shareopt{display:flex;gap:14px;align-items:flex-start;text-align:left;border:1.5px solid var(--b1);background:var(--p1);border-radius:var(--r1);padding:14px}
.shareopt svg.i{color:var(--ac);margin-top:2px}
.shareopt b{display:block}
.shareopt span span{display:block;color:var(--t3);font-size:.88rem}
body.shared .detailpane{position:static;transform:none;visibility:visible;overflow:visible}
body.shared .main,body.shared .tabbar,body.shared .fab{display:none}
.sharedmain{padding:calc(var(--hdr) + var(--top) + 4px) 0 40px}

/* ---------- cook mode: up next ---------- */
.ul{display:block;font-size:.8rem;font-weight:700;color:var(--t3);margin-bottom:6px}
.uses{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;align-items:center}
.uses .ul{width:100%;margin-bottom:0}
.use{background:var(--p2);border-radius:999px;padding:4px 12px;font-size:1rem}
.upnext{margin-top:26px;border-top:2px dashed var(--b1);padding-top:16px}
.upnext p{margin:0;font-size:1.15rem;line-height:1.45;color:var(--t2);overflow-wrap:anywhere}
.upnext .use{font-size:.95rem}

/* ---------- printing a recipe card ---------- */
#print{display:none}
@media print{
  body.printing > *:not(#print){display:none!important}
  html{background:#fff!important}
  body.printing{background:#fff;color:#000;min-height:0;overflow:visible;height:auto}
  body.printing #print{display:block;font-family:var(--fbody);font-size:11pt;line-height:1.4;color:#000}
  #print h1{font-family:var(--fdisp);font-weight:400;font-size:24pt;margin:0 0 4pt}
  #print h2{font-family:var(--fdisp);font-weight:400;font-size:14pt;margin:14pt 0 6pt;border-bottom:1px solid #999}
  #print .pm{color:#444;margin:0}
  #print .pcols{display:grid;grid-template-columns:2fr 3fr;gap:18pt}
  #print ul,#print ol{margin:0;padding-left:16pt}
  #print li{margin:3pt 0}
  #print li.h{list-style:none;margin-left:-16pt;font-weight:700;margin-top:8pt}
  #print .pn{white-space:pre-wrap}
  @page{margin:16mm}
}

/* 1.2: servings controls */
.cookserv{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
.revserv{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--p1);border-radius:var(--r1);padding:10px 12px;margin:0 0 12px}
.revserv .flabel{margin:0}
.revfor{font-size:.88rem;color:var(--t2);background:var(--p2);border-radius:var(--r1);padding:10px 12px;margin:0 0 10px}
b.scaled{font-weight:700;color:var(--ac)}
.row4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row4 .field{min-width:0}

/* ===================== 2.0 ===================== */
.hint{font-size:.85rem;color:var(--t3);margin:6px 0 0}
.lede{margin:0 0 12px;color:var(--t2)}
body.cooking .scrim{z-index:74}
body.cooking .sheet{z-index:75}
.tabbar button{min-width:0;padding:0 2px}
.tabbar button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row3{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:0 10px}
.row3 .field{min-width:0}
.row3 .field:last-child{grid-column:1/-1}
.checkrow{display:flex!important;align-items:center;gap:10px;min-height:44px;font-weight:400!important;color:var(--t1)!important;font-size:1rem!important}
.checkrow input{width:22px;height:22px;accent-color:var(--ac);margin:0}
.rrow .sub .wk{color:var(--ok);font-weight:700}

/* plan: meal prep */
.prepbar{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.prepbar .btn svg.i{width:1.05rem;height:1.05rem}
.pegrid{display:flex;flex-wrap:wrap;gap:12px 20px}
.fridge{margin:0 0 16px}
.fridge .fh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fridge h2{font-family:var(--fdisp);font-weight:400;font-size:1.25rem;margin:0;display:flex;align-items:center;gap:8px}
.fridge h2 svg.i{color:var(--ac)}
.flist{list-style:none;margin:8px 0 0;padding:0}
.frow{display:flex;align-items:center;gap:8px;border-top:1px solid var(--b1);padding:6px 0}
.fmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;padding:4px 0}
.fmain .tile{width:42px;height:42px;font-size:1.25rem}
.fmain .info{min-width:0;flex:1}
.fmain .nm{display:block;font-weight:700;overflow-wrap:anywhere}
.fmain .sub{display:block;font-size:.85rem;color:var(--t3)}
.fmain .sub b{color:var(--t2)}
.frow.urgent .sub{color:var(--bad);font-weight:700}
.frow.urgent .sub b{color:var(--bad)}
.frow .btn{flex:none}
.preplist{list-style:none;margin:6px 0 0;padding:0}
.preplist li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--b1)}
.preplist .pn{font-family:var(--fdisp);color:var(--ac);font-size:1.3rem;width:22px;flex:none;text-align:center;line-height:1.6}
.preplist .tile{width:44px;height:44px;font-size:1.3rem;flex:none}
.preplist .info{flex:1;min-width:0}
.preplist .nm{display:block;font-weight:700;overflow-wrap:anywhere}
.preplist .sub{display:block;font-size:.85rem;color:var(--t3)}
.preplist .btnrow{margin:8px 0 0;align-items:center}
.preplist .okmsg{display:inline-flex;align-items:center;gap:4px;font-size:.9rem}
.preplist li.done .nm{color:var(--t2)}

/* recipe page: meal prep, nutrition, swaps */
.seg button.sugg{border-style:dashed;border-color:var(--ac)}
.keepsline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.keepsline svg.i{color:var(--t3)}
.est{font-family:var(--fbody);font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);background:var(--p2);border-radius:999px;padding:3px 8px;vertical-align:middle;margin-left:4px}
.nstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.nstats b{display:block;font-family:var(--fdisp);font-weight:400;font-size:1.3rem;line-height:1.2;white-space:nowrap}
.nstats span{font-size:.8rem;color:var(--t3)}
.nnote{font-size:.82rem;color:var(--t3);margin:10px 0 0;overflow-wrap:anywhere}
.costline{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;font-size:.92rem;color:var(--t2)}
.costline svg.i{flex:none;margin-top:1px;color:var(--ok)}
.costline.muted svg.i{color:var(--t3)}
.ings li.hasswap{display:flex;align-items:flex-start;gap:2px}
.ings li.hasswap .ing{flex:1;min-width:0}
.ings li:last-child .ing{border-bottom:0}
.ings li.hasswap{border-bottom:1px dashed var(--b1)}
.ings li.hasswap:last-child{border-bottom:0}
.ings li.hasswap .ing{border-bottom:0}
.swapbtn{width:40px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--t3);border-radius:8px;flex:none}
.swapbtn svg.i{width:1.1rem;height:1.1rem}
.swapbtn:active{background:var(--p2)}
.swaps{padding-left:1.2rem;margin:0 0 12px}
.swaps li{margin:8px 0;line-height:1.4}

/* shopping: list / pantry, money, done shopping */
.viewseg{margin:12px 0 4px}
.viewseg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.viewseg button svg.i{width:1.05rem;height:1.05rem}
.viewseg .cnt{font-size:.78rem;font-weight:700;background:var(--p2);color:var(--t2);border-radius:999px;padding:1px 7px}
.viewseg .cnt.warn{color:var(--warn)}
.moneyline{display:flex;gap:6px;align-items:flex-start;font-size:.88rem;color:var(--t2);margin:0 0 6px}
.moneyline svg.i{width:1.05rem;height:1.05rem;color:var(--ok);flex:none;margin-top:1px}
.incart>span{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.donelist{list-style:none;margin:0;padding:0}
.donelist li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--b1)}
.donelist .tx{flex:1;min-width:0}
.donelist .nm{display:block;font-weight:700;overflow-wrap:anywhere}
.donelist .from{display:block;font-size:.8rem;color:var(--t3)}
.donelist .inp.price{width:88px;flex:none;padding-left:10px;padding-right:8px}
.donelist .chip{flex:none}
.pcard{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.pcard b{display:flex;align-items:center;gap:6px}
.pcard .muted{display:block;font-size:.88rem;overflow-wrap:anywhere}
.pcard>div{min-width:0;flex:1 1 180px}
.useup b svg.i{color:var(--ok)}

.uu>span:first-child{width:100%}
.prow2{padding:6px 0}
.prow2 .tx{flex:1;min-width:0;padding:6px 0}
.prow2 .nm{display:block;font-weight:700;overflow-wrap:anywhere}
.prow2 .from{display:block;font-size:.8rem;color:var(--t3)}
.pstat{min-width:62px;min-height:36px;border-radius:999px;font-size:.85rem;font-weight:700;padding:0 12px;border:1.5px solid var(--b1);background:var(--p1);color:var(--ok)}
.pstat.low{color:var(--warn);border-color:var(--warn)}
.pstat.out{color:var(--bad);border-color:var(--bad);background:var(--p2)}

/* discover */
.dsec{font-family:var(--fdisp);font-weight:400;font-size:1.35rem;margin:26px 0 4px;display:flex;align-items:center;gap:8px}
.dsec svg.i{color:var(--ac)}
.dhint{color:var(--t3);font-size:.9rem;margin:0 0 8px}
.taste h2{font-family:var(--fdisp);font-weight:400;font-size:1.35rem;margin:0}
.taste>.muted{font-size:.88rem;margin:2px 0 10px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 18px}
.tgrid h3{font-size:.9rem;color:var(--t2);margin:6px 0 4px}
.bars{list-style:none;margin:0;padding:0}
.bars li{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.9rem}
.bars .tl{width:92px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
.bars .tb{flex:1;height:10px;background:var(--p2);border-radius:999px;overflow:hidden}
.bars .tb i{display:block;height:100%;background:var(--ac);border-radius:999px}
.flav{margin:12px 0 0;font-size:.92rem;color:var(--t2)}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.idea{background:var(--p1);border-radius:var(--r2);padding:var(--cardpad);box-shadow:var(--shadow);min-width:0;position:relative;display:flex;flex-direction:column}
.idea .ihide{position:absolute;top:4px;right:4px;color:var(--t3)}
.idea h3{padding-right:36px}
.idea .btnrow{margin-top:auto;padding-top:10px}
html[data-cards="lined"] .idea{box-shadow:none;border:1.5px solid var(--b1)}
html[data-cards="flat"] .idea{box-shadow:none;background:var(--p2)}
.idea h3{font-family:var(--fdisp);font-weight:400;font-size:1.2rem;margin:0 0 4px;overflow-wrap:anywhere}
.idea p{margin:0 0 6px;color:var(--t2);font-size:.92rem}
.idea .why{color:var(--ac);font-weight:700;font-size:.85rem}
.idea .tags{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.tagchip.static{font-size:.78rem;padding:2px 9px}
html[data-cards="flat"] .idea .tagchip{background:var(--p1)}
.idea .btnrow{margin-bottom:0}
.idea a.btn{text-decoration:none}
.idea [data-act="ideasave"][aria-pressed="true"]{background:var(--acd);border-color:var(--ac)}
@media (max-width:759px){
  .ideas{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:min(80vw,340px);overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
    margin:0 calc(-1 * var(--pad));padding:4px var(--pad) 10px;scroll-padding:0 var(--pad);overscroll-behavior-x:contain}
  .ideas .idea{scroll-snap-align:start}
}

/* ===================== 2.1 ===================== */
html{overflow-x:hidden}
html,body{max-width:100%}
/* nothing from the page shows under a sheet: the sheet's color runs on past its bottom edge */
.sheet::after{content:"";position:absolute;left:0;right:0;top:100%;height:100vh;background:var(--bg)}
/* while typing: no tab bar or + button floating over the keyboard */
body.typing .tabbar,body.typing .fab,body.typing .timers{display:none}
@media (max-width:759px){
  /* the editor fills the screen, like a recipe does */
  .sheet.full{top:0;max-height:none;height:100%;height:100dvh;border-radius:0}
  .sheet.full .grab{padding-top:calc(var(--top) + 6px)}
  /* keyboard up: the sheet fits exactly in the space above it */
  body.kb .sheet{top:var(--vvtop,0px);bottom:auto;height:var(--vvh,100%);max-height:none;border-radius:0}
  body.kb .sheet .grab{padding-top:calc(var(--top) + 6px)}
  body.kb .sheet .sh-b{padding-bottom:20px}
  body.kb .sheet .sh-f{padding-bottom:10px}
  body.kb .scrim{background:var(--bg)}
}
.detailpane.dragging,.sheet.dragging{transition:none}
.lowhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.lowhead .sect{margin:10px 0 2px}
.lowlist{background:var(--p1);border-radius:var(--r1);padding:0 12px;box-shadow:var(--shadow)}
.lowlist .srow:last-child{border-bottom:0}
.prow2{gap:6px}
.prow2 .tx{overflow-wrap:anywhere}
.pstat{flex:none}
.statopts{display:flex;flex-direction:column;gap:8px}
.statopt{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;gap:2px 10px;border:1.5px solid var(--b1);background:var(--p1);border-radius:var(--r1);padding:12px 14px;min-height:60px}
.statopt b{font-size:1.05rem}
.statopt span{grid-column:1;color:var(--t3);font-size:.88rem}
.statopt svg.i{grid-row:1/3;grid-column:2;color:var(--ac)}
.statopt.have b{color:var(--ok)}.statopt.low b{color:var(--warn)}.statopt.out b{color:var(--bad)}
.statopt[aria-pressed="true"]{border-color:var(--ac);background:var(--acd)}
/* calendars: Plan it and the month view */
.planseg{margin:12px 0 2px}
.calttl{font-family:var(--fdisp);font-size:1.15rem;margin:0 0 8px;text-align:center}
.cal{margin:4px 0 10px}
.calhd,.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calhd span{text-align:center;font-size:.75rem;font-weight:700;color:var(--t3);padding:2px 0 4px}
.cd{position:relative;min-height:48px;border-radius:10px;background:var(--p1);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 0 4px;min-width:0}
.cd .dn{font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.cd .mo{font-size:.6rem;font-weight:700;color:var(--ac);text-transform:uppercase;line-height:1;margin:-2px 0 1px}
.cd:has(.mo){padding-top:4px}
.cd .mk{display:flex;gap:2px;align-items:center;justify-content:center;min-height:9px;margin-top:3px;flex-wrap:wrap}
.cd .mk i{width:7px;height:7px;border-radius:50%;background:var(--pig)}
.cd .mk em{font-style:normal;font-size:.65rem;color:var(--t2);font-weight:700}
.cd.today{border-color:var(--ac)}
.cd.today .dn{color:var(--ac)}
.cd.past{opacity:.55}
.cd:disabled{opacity:.35;cursor:default}
.cd.other{background:transparent}
.cd.other .dn{color:var(--t3);font-weight:400}
.cd.sel,.cd[aria-pressed="true"]{background:var(--acd);border-color:var(--ac);opacity:1}
.cal.month .cd{min-height:54px}
html[data-cards="lined"] .cd:not(.other){border-color:var(--b1)}
html[data-cards="lined"] .cd.today{border-color:var(--ac)}
/* review: pantry check */
.pancheck{background:var(--p1);border-radius:var(--r1);padding:4px 12px 6px;margin:0 0 6px;box-shadow:var(--shadow)}
.pancheck .sect{display:flex;align-items:center;gap:6px;margin-top:10px}
.pancheck .sect svg.i{color:var(--ac)}
.pancheck>.muted{font-size:.88rem;margin:2px 0 4px}
.pcrow{display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;border-bottom:1px solid var(--b1);padding-bottom:8px}
.pcrow:last-child{border-bottom:0}
.pcrow .sck{flex:1 1 180px;min-width:0}
.seg.mini{flex-wrap:nowrap;gap:4px;margin-left:36px}
.seg.mini button{min-height:36px;padding:4px 12px;font-size:.85rem}
.seg.mini button.low[aria-pressed="true"]{border-color:var(--warn)}
.seg.mini button.out[aria-pressed="true"]{border-color:var(--bad)}
/* with a panel open, notifications sit above its buttons instead of over its title */
body.locked .toast{top:auto;bottom:calc(var(--bot) + 84px);transform:translate(-50%,8px)}
body.locked .toast.in{transform:translate(-50%,0)}
body.kb .toast{bottom:auto;top:calc(var(--vvtop,0px) + var(--vvh,100%) - 76px)}
.photoimp{margin:12px 0 4px}
.photoimp .btn svg.i{width:1.05rem;height:1.05rem}
.pstat{display:inline-flex;align-items:center;gap:2px;padding:0 8px 0 12px}
.pstat svg.dd{width:1rem;height:1rem;transition:transform .15s}
.pstat[aria-expanded="true"] svg.dd{transform:rotate(180deg)}
.prow2.open{border-bottom:0}
.pdrop{display:flex;gap:6px;padding:2px 0 10px;border-bottom:1px solid var(--b1)}
.pdrop button{flex:1;min-width:0;min-height:44px;border-radius:var(--r1);border:1.5px solid var(--b1);background:var(--p1);font-size:.9rem;padding:4px 6px}
.pdrop button.have b{color:var(--ok)}.pdrop button.low b{color:var(--warn)}.pdrop button.out b{color:var(--bad)}
.pdrop button[aria-pressed="true"]{border-color:var(--ac);background:var(--acd)}
.lowlist .pdrop{border-bottom:0}
.pcrow{display:block;padding:10px 0}
.pcname{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin-bottom:6px}
.pcname .need{color:var(--t3);font-size:.88rem}
.pcrow .seg.mini{margin-left:0;display:flex}
.pcrow .seg.mini button{flex:1;min-width:0;padding:4px 6px}
.pcres{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:.85rem;font-weight:700}
.pcres svg.i{width:1rem;height:1rem}
.pcres.add{color:var(--ac)}.pcres.skip{color:var(--ok)}

/* ===================== 2.3 ===================== */
/* the top bar scrolls away with the page instead of staying put */
.hdr{position:absolute}
.dbar{position:relative}

/* pantry check: one line per item */
.pclist{list-style:none;margin:4px 0 0;padding:0}
.pcline{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--b1)}
.pcline:last-child{border-bottom:0}
.pcn{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.3}
.pcn .need{color:var(--t3);font-size:.85rem;white-space:nowrap}
.pcline.adding .pcn b{color:var(--ac)}
.seg.tiny{display:flex;flex-wrap:nowrap;gap:3px;flex:none}
.seg.tiny button{min-height:34px;min-width:44px;padding:2px 9px;font-size:.82rem;border-radius:999px}
.seg.tiny button.low[aria-pressed="true"]{border-color:var(--warn)}
.seg.tiny button.out[aria-pressed="true"]{border-color:var(--bad)}
.pancheck>.muted b{color:var(--t2)}
/* pantry: restock under the low list */
.lowsect .cnt{font-family:var(--fbody);font-size:.8rem;font-weight:700;background:var(--p2);color:var(--warn);border-radius:999px;padding:1px 8px;vertical-align:middle;margin-left:4px}
.restockrow{margin:8px 0 4px}
.restockrow .btn{min-height:36px;font-size:.88rem}
.tickhint{margin:8px 2px 0}

/* ===================== 2.4 ===================== */
/* each recipe's color carries onto its page and Cook mode */
.dbar{background:var(--themed,var(--ch));color:var(--themet,var(--cht))}
.cook .ctop{background:var(--themed,var(--ch));color:var(--themet,var(--cht))}
/* import box: one summary line that says what's happening */
.importbox{padding:0}
.importbox>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 14px;cursor:pointer;font-weight:700}
.importbox>summary::-webkit-details-marker{display:none}
.importbox .ib-t{display:inline-flex;align-items:center;gap:8px}
.importbox .ib-t svg.i{color:var(--ac)}
.importbox:not([open])>summary .ib-t::after{content:"Show";font-weight:400;font-size:.85rem;color:var(--ac);margin-left:4px}
.importbox .ib-b{padding:0 14px 12px}
.impstate{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:700;color:var(--t2)}
.importbox.ok .impstate{color:var(--ok)}
.importbox.err .impstate{color:var(--bad)}
.importbox.busy .impstate{color:var(--ac)}
.impstate svg.i{width:1rem;height:1rem}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-right-color:currentColor;opacity:.6}}
.filebtn,.field label.filebtn{cursor:pointer;display:inline-flex;align-items:center;gap:7px;margin:0;color:var(--t1);font-size:.9rem}
.photoimp .filebtn{margin-top:4px}
/* tags */
.tagsel{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px;min-height:36px;align-items:center}
.tagnew{display:flex;gap:8px;margin:0 0 6px}
.tagnew .inp{flex:1;min-width:0}
.tagnew .btn{flex:none;min-height:46px}
.tgl{font-size:.8rem;font-weight:700;color:var(--t3);margin:10px 0 4px}
.tchip svg.i{width:.95rem;height:.95rem}
.taggroups>summary{cursor:pointer;color:var(--ac);font-weight:700;font-size:.92rem;padding:6px 0}
/* colors */
.colorpick{display:flex;flex-wrap:wrap;gap:6px}
.cswatch{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--b1);background:var(--p1);border-radius:999px;padding:4px 11px 4px 5px;min-height:36px;font-size:.85rem;color:var(--t2)}
.cswatch i{width:24px;height:24px;border-radius:50%;background:var(--pig);flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.cswatch[aria-pressed="true"]{border-color:var(--ac);background:var(--acd);color:var(--t1);font-weight:700}

/* 2.6: amounts inside the cook-mode step */
.cook .big .iamt{display:inline-block;margin:0 .1em 0 .3em;padding:.02em .42em;border-radius:.45em;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--t1);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ac) 28%,transparent);font-weight:700;font-size:.82em;line-height:1.35;vertical-align:.08em;white-space:nowrap}
.nw{white-space:nowrap}

/* 2.6: motion and press feedback (all of it is skipped with Reduce Motion) */
.btn,.chip,.iconbtn,.tabbar button,.fab,.cswatch,.ing .ck,.sck,.tmr,.stepper button{transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .16s,border-color .16s,color .16s,box-shadow .16s}
.btn:active:not([disabled]),.chip:active,.cswatch:active,.tmr:active{transform:scale(.965)}
.iconbtn:active,.stepper button:active{transform:scale(.9)}
.tabbar button:active{transform:scale(.92)}
.fab:active{transform:scale(.9)}
.rrow{transition:background-color .15s}
.ing.pop .ck,.sck.pop .ck{animation:pop .34s cubic-bezier(.2,.9,.3,1.4)}
.chip.pop,.btn.icon.pop,.cswatch.pop{animation:pop .34s cubic-bezier(.2,.9,.3,1.4)}
.btn.pop:not(.icon){animation:pressok .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes pressok{0%{transform:scale(1)}35%{transform:scale(.95)}100%{transform:scale(1)}}
.listpane.pane-in{animation:panein .24s cubic-bezier(.2,.8,.2,1)}
@keyframes panein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cook{animation:cookin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes cookin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.cook .cin.from-next{animation:stepnext .26s cubic-bezier(.2,.8,.2,1)}
.cook .cin.from-prev{animation:stepprev .26s cubic-bezier(.2,.8,.2,1)}
@keyframes stepnext{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes stepprev{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
details.importbox[open] .ib-b,details.help[open]>:not(summary),details.taggroups[open]>:not(summary){animation:fadedown .2s ease}
@keyframes fadedown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.btn:active,.chip:active,.iconbtn:active,.tabbar button:active,.fab:active,.cswatch:active,.tmr:active,.stepper button:active{transform:none}}

/* 2.7: works offline */
.updbar{position:fixed;left:12px;right:12px;bottom:calc(var(--tab) + var(--bot) + 88px);z-index:95;display:flex;align-items:center;gap:10px;padding:10px 8px 10px 16px;border-radius:var(--r1);background:var(--ch);color:var(--cht);box-shadow:0 10px 30px -8px rgba(0,0,0,.45);transform:translateY(16px);opacity:0;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s;max-width:560px;margin:0 auto}
.updbar.in{transform:none;opacity:1}
.updbar span{flex:1;min-width:0;font-size:.92rem;line-height:1.3}
.updbar .iconbtn{color:inherit;flex:none}
.updbar .btn{flex:none}
body.locked .updbar,body.cooking .updbar{bottom:calc(var(--bot) + 12px)}
.ver.offline{display:flex;align-items:flex-start;justify-content:center;gap:6px}
.ver.offline svg.i{width:1rem;height:1rem;flex:none;color:var(--ok);margin-top:2px}

body.locked:not(.cooking) .readd ol{padding-left:1.2rem;margin:8px 0 14px}
.readd li{margin:0 0 10px;line-height:1.4}
.readd .copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.readd code{font-size:.8rem;background:var(--p2);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
body.cooking .scrim{z-index:80}
body.cooking .sheet{z-index:81}

/* 2.9: two recipes at once */
.cook .twoplan{background:color-mix(in srgb,var(--ac) 10%,var(--p1));border:1px solid color-mix(in srgb,var(--ac) 25%,transparent);border-radius:var(--r1);padding:12px 14px;margin:0 0 14px;font-size:.95rem;line-height:1.4;color:var(--t1)}
.cook .cwho{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--t1);font-size:1rem;margin:0 0 6px;max-width:100%}
.cook .cwho .dot{width:12px;height:12px;border-radius:50%;background:var(--pig);flex:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--pig) 30%,transparent)}
.cook .cwho .of{font-weight:400;color:var(--t2)}
.cook .during{font-style:italic;color:var(--t2);margin:0 0 2px;font-size:1rem}
.cook .addtwo{margin-top:18px;display:inline-flex;align-items:center;gap:6px}
.cook .drawer .sec-h+ul,.cook .drawer .sec-h{margin-top:0}
.cook .drawer .sec-h:not(:first-child){margin-top:22px}
.addday.cookboth{color:var(--ac);font-weight:700}

/* 2.9: sites you follow */
.dsec .dmore{margin-left:auto;font-size:.9rem;font-family:var(--fbody,inherit)}
.followcta p{margin:0 0 12px}
.followline{display:flex;gap:8px}
.followline .inp{flex:1;min-width:0}
.picks,.follows{list-style:none;margin:6px 0 0;padding:0}
.picks li,.follows li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b1)}
.picks li:last-child,.follows li:last-child{border-bottom:0}
.picks .pk,.follows .pk{flex:1;min-width:0;display:flex;flex-direction:column}
.picks .pk b,.follows .pk b{font-weight:700;color:var(--t1)}
.picks .pk span,.follows .pk span{color:var(--t2);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.posts{display:flex;flex-direction:column;gap:12px}
.post{position:relative;display:flex;gap:12px;background:var(--p1);border:1px solid var(--b1);border-radius:var(--r1);padding:12px;padding-right:40px}

.post .pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.post .pbody{flex:1;min-width:0}
.post .psite{font-size:.8rem;color:var(--t2);font-weight:700;letter-spacing:.01em}
.post .pnew{display:inline-block;background:var(--ac);color:var(--bt);border-radius:999px;padding:0 7px;font-size:.72rem;margin-left:4px;vertical-align:1px}
.post h3{margin:2px 0 4px;font-size:1.02rem;line-height:1.3;overflow-wrap:anywhere}
.post h3 a{color:var(--t1);text-decoration:none}
.post p{margin:0 0 8px;color:var(--t2);font-size:.88rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .btnrow{display:flex;gap:8px;flex-wrap:wrap}

.post .btn .spin{margin-right:6px}
.showmore{margin-top:10px}
.dhint .spin{display:inline-block;vertical-align:-2px;margin-right:4px}

.post a.btn{text-decoration:none}

/* 2.9: what you made shows on the plan */
.madetag{display:inline-flex;align-items:center;gap:3px;color:var(--ok);font-weight:700}

/* 2.11: compact blog posts */
.posts{gap:8px}

.post .pimg{text-decoration:none}
@media (max-width:359px){.post .pacts .w{display:none}.post .pacts{flex-wrap:nowrap}}

.detailpane.edging{box-shadow:-14px 0 28px -10px rgba(0,0,0,.35)}

<script>
var SEED = [{"title": "Philly Cheesesteak", "servings": 4, "tags": ["dinner", "beef", "sandwich", "American"], "ingredients": "1 green pepper\n1 yellow onion\n1 lb regular deli roast beef (or make your own, see notes)\n2 tbsp oil\nsalt\npepper\n4 slices cheese\ntortillas or French rolls\nranch, for drizzling", "steps": "Slice the green pepper and onion lengthwise into strips.\nCut the roast beef into strips too.\nHeat about 2 tablespoons of oil in a frying pan over medium-high heat.\nWhen hot, throw in the peppers and onions and toss to coat with oil. Add some salt and pepper.\nStir it around for about 2-3 minutes, then add the beef.\nLet it all cook together for about 5 minutes, or until the onions and peppers are wilted.\nTurn off the heat. In the pan, separate it into 4 piles and put a slice of cheese on each. Let the cheese melt.\nScoop it up and put it on a tortilla or French roll. Drizzle some ranch over it for sauce.", "notes": "To make your own roast beef, see the Roast Beef Rub recipe.", "source": "https://docs.google.com/document/d/12jcezM17j9uS60m15WLc45vRdofjtZvIDwyjSJ1Z_0w/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Beef and Broccoli", "servings": 4, "tags": ["dinner", "beef", "vegetables", "Asian"], "ingredients": "1 head broccoli\nbeef (sirloin is good)\n3 cloves garlic\noyster sauce (a solid amount)\nsoy sauce (a good amount)\nsesame oil (a good amount or less)\nfish sauce (a good amount or less)\noil, for the pan\ncornstarch or flour, to thicken", "steps": "Slice the beef into thin strips.\nIn a bowl, mix the beef with the oyster sauce, soy sauce, sesame oil and fish sauce.\n- Not exact measurements, this is an estimate. Eyeball it and taste it.\nLet the mixture sit for 20ish min to marinate.\nWhile that's happening, cut the broccoli off the main stem and dice the garlic.\nAdd the broccoli to boiling water for 5 min, then remove immediately.\nIn a pan, add some oil and begin cooking the beef.\nCook the beef about 50% of the way and remove it. In the same pan, add the broccoli.\nAfter it cooks a little, add the beef back in.\nThere should be some juice/broth at the bottom. To thicken it:\n- Mix some cornstarch (or flour) in a bowl with some water.\n- Slowly add it to the broth and stir, so it doesn't clump and doesn't get too thick.\nServe.", "notes": "", "source": "https://docs.google.com/document/d/1fT0WQqgZbP0GHWBiBTHYIEl9y7yvkvtCPFtiPvIeJ18/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Stir-Fry Rotisserie Chicken", "servings": 4, "tags": ["dinner", "chicken", "vegetables", "quick"], "ingredients": "1 rotisserie chicken, meat pulled (discard bones and skin)\n1 red bell pepper\n1 yellow bell pepper\n1 orange bell pepper\n1 bunch green onion\n1 small yellow onion\n2 cloves garlic\n2 tbsp oil\n2-3 tbsp chicken bouillon, plus more to taste\n1/2 tsp black pepper", "steps": "Cut the red, yellow and orange bell peppers into small sticks.\nDice the yellow onion.\nCrush the garlic.\nSlice the green onions into tiny pieces.\nPut 2 tbsp oil in a frying pan, add the onion and garlic and sauté for about 3 to 5 min.\nAdd 2-3 tbsp chicken bouillon.\nAdd the bell peppers and stir for about 2 min.\nAdd the chicken and 1/2 tsp black pepper.\nSauté for 2 to 3 min, then add the green onions.\nAdd more chicken bouillon to taste.", "notes": "", "source": "https://docs.google.com/document/d/1ocRso6oLgtil5wDjO7jbMUjTvGRpcqRb9v7Wd5NRV9Y/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Chicken Carbonara", "servings": 3, "tags": ["dinner", "chicken", "pasta", "eggs", "Italian"], "ingredients": "3 eggs\n1/4 cup parmesan, at room temperature\n1/2 box fettuccine, angel hair or spaghetti\n2 boneless skinless chicken thighs\nsalt\nItalian seasoning\nred pepper flakes", "steps": "In one pot, start cooking your pasta.\nWhile that's cooking, cut the chicken thighs into bite-size pieces.\nPut the chicken in a pan and season with salt, Italian seasoning and red pepper flakes.\nCrack the eggs into a bowl, add the parmesan and stir. It should be a slightly thick mixture.\nOnce the pasta is done, drain it immediately.\nOnce the chicken is cooked, add the pasta to the pan and turn the heat very low.\nAdd the egg mixture and temper it, stirring quickly until combined and slightly thickened.\nIf the eggs don't thicken, stir quickly over low heat. The egg mixture isn't supposed to cook, just melt the cheese.", "notes": "", "source": "https://docs.google.com/document/d/1g-7cROBllxI4-c_3ZUWfaXOV1moY-VvC5soV_wk4HgI/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Garlic Chicken", "servings": 4, "tags": ["dinner", "chicken"], "ingredients": "Chicken:\n600g chicken breast\n1 tsp olive oil\nsmoked paprika, garlic powder and salt, to season\nSauce (blended):\n300ml fat free evaporated milk (Carnation Light & Creamy)\n25g freshly grated parmesan (just under 1/4 cup)\n1 tsp oregano\n1 tsp garlic powder\n1/2 tsp black pepper\nFor the pan:\n10g butter\n4 cloves garlic, diced\n150ml chicken stock (a bit over 1/2 cup)\n90g light cream cheese (3.5 oz)\n1 tsp smoked paprika\n2 tsp chicken stock powder (Vegeta, low sodium)\nchopped spinach", "steps": "Season the chicken with smoked paprika, garlic powder and salt.\nPut the sauce ingredients in a blender and blend until smooth.\nGet the other ingredients ready: dice the garlic, measure out the chicken stock and the cream cheese.\nIn a pan on medium heat, add the butter and cook the chicken, roughly 5-6 min each side.\nOnce the chicken is cooked, turn the same pan to LOW heat and add the blended sauce, garlic, stock and cream cheese.\nKeep mixing, then add the smoked paprika, chicken stock powder and chopped spinach.\nMix until thick.\nServe with rice or pasta.", "notes": "", "source": "https://docs.google.com/document/d/1JO8B9UzcMDL0Qa_oXmY8obPumSdXxc9SSqT6PQc4FQc/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Gyudon", "servings": 1, "tags": ["dinner", "beef", "rice", "eggs", "Japanese"], "ingredients": "Beef:\n5 oz sliced beef ribeye, raw\n3/4 medium yellow onion\n1/3 tbsp ginger\n1/3 tbsp brown sugar\n1/4 cup beef bone broth\n1/3 tsp dashi powder\n1 tbsp soy sauce\n1 tbsp mirin\nspray oil\nGarnish:\n1 egg\ngreen onions\nsteamed white rice", "steps": "Dice the green onions and chop the yellow onion.\nIn a bowl, combine the ginger, brown sugar, dashi powder, soy sauce, mirin and beef bone broth to make the sauce.\nIn a pan on medium-low heat coated with spray oil, add the chopped onion, sauce and beef. Cover with a lid and let it cook.\nIn a separate non-stick pan, fry an egg.\nIn a bowl over steamed white rice, add the beef and onion, then top with the fried egg and sliced green onions. Enjoy!", "notes": "", "source": "https://docs.google.com/document/d/1xJTFsBa8eoGBOSJERHIDvtpnj-wvxVO_5lFWqbt9apU/edit", "unit": "", "added": "2026-01-10", "prep": "", "cook": ""}, {"title": "Chicken Casserole", "servings": 4, "tags": ["dinner", "chicken", "baked"], "ingredients": "1/2 rotisserie chicken\n1 cup sour cream\n1 can cream of chicken soup\n1/2 box stuffing (Mrs. Cubbison's traditional, 12 oz box)\n1/4 stick butter or margarine\n1 cup chicken broth", "steps": "Preheat the oven to 350°F.\nPut the chicken in a bowl with the sour cream and cream of chicken soup and mix together.\nPour into an 8x8 baking dish.\nPour half a box of stuffing into a bowl.\nPour in the chicken broth.\n- No broth? Use a cup of warm water with 1-2 tsp bouillon.\nMix the two together and wait for the stuffing to absorb the broth.\nSpread the stuffing over the top of the baking dish.\nCut up the butter and set it on top.\nBake at 350°F for about 20-40 min. Keep an eye on it and take it out when the top begins to brown lightly.", "notes": "", "source": "https://docs.google.com/document/d/1kBBGfyJ3Sj3sCPgBGWSauxQ6vMT-NQXJjqXgyPgvJPk/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Tuscan Chicken", "servings": 4, "tags": ["dinner", "chicken", "Italian"], "ingredients": "Sauce:\n1/2 cup cottage cheese\n1/2 cup grated parmesan\n1/2 cup fat free milk\n1 tbsp tomato paste\n2 cloves garlic\ngarlic salt, to taste\nsalt, to taste\nChicken:\n24 oz chicken breast (try two, cut in half)\nItalian seasoning\ngarlic salt\npaprika\nsalt\noil and butter, for the pan\nTo serve:\npasta or rice\nspinach, cooked\nsun dried tomatoes\nred pepper flakes and parsley (optional)", "steps": "Blend the sauce ingredients together until smooth.\nSeason each side of the chicken until fully coated.\nHeat a pan on medium-high. Add some oil and butter, and once it melts, add the chicken: 6 min each side.\nIf serving with pasta: add some cooked spinach and sun dried tomatoes. Top the chicken and pasta with red pepper flakes and parsley.\nIf serving with rice: add spinach and sun dried tomatoes too, or serve plain.", "notes": "", "source": "https://docs.google.com/document/d/1BryjAxFTZScwwTGX-j9b2rQFEwUErNSe-2QXIPqvmHQ/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Gochujang Chicken", "servings": 2, "tags": ["dinner", "chicken", "rice", "Korean"], "ingredients": "Sauce:\n1 spoon gochujang (a solid spoon)\n1 spoon mirin\n3/4 spoon sesame oil\n3/4-1 spoon soy sauce\n3/4-1 spoon oyster sauce\n3/4-1 spoon honey\nsalt (a little bit)\n1/4 spoon ginger\n1/4 spoon garlic\nChicken:\n2 chicken thighs\ncornstarch, for coating\noil, for frying\nTo serve:\nwhite rice\ncabbage\nsesame seeds and green onion (optional)", "steps": "Cook some white rice to start.\nMix the sauce ingredients together.\nCut the chicken thighs into bite-size pieces (optional: salt them).\nDip each piece in a bowl of cornstarch, making sure they're covered.\nIn a pan with some oil, fry each side of the chicken for 4 min or until fully cooked. Don't stir-fry it; let it sit. You're looking for a golden brown crisp.\nWhile you wait, cut some cabbage into very thin slices.\nOnce the chicken is done, move it onto a plate.\nIn the same pan, add the sauce and bring it to a boil, then add the chicken back in.\nMix the chicken in the sauce so it's all coated. Let it cook for a minute more, then remove from heat.\nTo serve: rice on one third of the plate, sliced cabbage on the second third, and the chicken overlapping on the last third.\nFor extra points, add sesame seeds and thinly cut green onion on top of the chicken.", "notes": "", "source": "https://docs.google.com/document/d/1-wxJMdJqCdbMXTJJVme1wIywwIWftfcFUdqRSCU3VUQ/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Roast Beef Rub", "servings": 1, "tags": ["dinner", "beef", "basics"], "ingredients": "2 tbsp salt\n1 tbsp dried thyme\n1 tbsp dried rosemary\n1 tbsp black pepper\n1 tbsp onion powder\n1 tbsp garlic powder\nyellow mustard, as a binder (or mayonnaise or olive oil)\nbeef roast", "steps": "Coat the roast in yellow mustard as a binder (or mayonnaise or olive oil), then cover it with the rub.\nPut it in a pan in the oven at 325°F.\nOnce it reaches 130°F inside, pull it out.\nLet it sit for 15-20 minutes, then it's good to go.", "notes": "Use it with the Philly Cheesesteak recipe.", "source": "https://docs.google.com/document/d/10ZST7uwbIT6uVrcG6FX90u57_TAxxgKZjsdz1vHos-8/edit", "unit": "roast", "added": "2026-01-05", "prep": "", "cook": ""}, {"title": "Cá Kho", "servings": 6, "tags": ["dinner", "fish", "Vietnamese"], "ingredients": "2-2 1/2 lb salmon, cubed\n4-5 cloves garlic, finely chopped\n1/2 tsp black pepper\n2 tbsp fish sauce (Việt Hương, 3 Crabs brand)\n1 tsp sugar\n2 tsp chicken bouillon\n1 tbsp dark caramel (nước màu), for color\n2 handfuls green onions\n2 tbsp oil", "steps": "Skin and wash the salmon, cut it into cubes and put it in a bowl.\nTo the bowl add 2 tbsp nước mắm (fish sauce), 1-2 tsp sugar, 2 tsp chicken bouillon and 1/2 tsp black pepper. Stir.\nSmash one clove of garlic, cut it into tiny pieces and add it to the bowl.\nIf you don't have nước màu: put 2 tbsp sugar in a pan on medium-low heat with 1-2 tsp water (and maybe 1 tsp oil) and caramelize it until it's a dark brown liquid. Pour into the bowl and stir.\nSmash and dice the remaining garlic and set aside.\nCut up about 2 handfuls of green onions and set aside.\nHeat a pot on medium to medium-high. Add 2 tbsp oil, heat it up, then add the garlic you set aside.\nWait for the garlic to turn slightly brown (not black). Pour the bowl in. Stir minimally. Once it's cooked on the outside, add 3 tbsp water and put the lid on.\nWhen it's essentially done, taste it, add the green onions, stir and let it sit for a bit. Enjoy!", "notes": "", "source": "https://docs.google.com/document/d/1jQrgf4LziruXIMZgxW8XwoV_VkpLqVLSrPS8sF4TQ7s/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Oyakodon", "servings": 2, "tags": ["dinner", "chicken", "eggs", "rice", "Japanese"], "ingredients": "1 lb chicken thigh, cut into bite-size pieces\n1/2 onion, sliced\n1 scallion, white part sliced\n1/3 cup water\n1/2 tsp hondashi\n1 tbsp soy sauce\n1 tbsp sake\n2 tbsp mirin\n1 tbsp sugar\n2 eggs\nhot short-grain rice\nshredded nori (optional)", "steps": "Slice the onion and scallion, and cut the chicken thigh into bite-size pieces.\nHeat the water, hondashi, soy sauce, sake, mirin and sugar together in a small pan on medium heat.\nOnce it simmers and the sugar dissolves, add the onions and chicken. Cook for 6-8 minutes until the chicken is cooked through, then add the sliced scallion on top.\nLightly beat two eggs, keeping the whites and yolks somewhat separate. Slowly pour the eggs over everything and cover with a lid for a minute or two.\nOnce the eggs are cooked through, pour it over a bed of hot short-grain rice.\nOptional: garnish with shredded nori.", "notes": "", "source": "https://docs.google.com/document/d/1VAvTz5hV_Nw2c66NblnXI-gjzrjbMpe5GRjE42dK6Js/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Fish Sauce (Nước Mắm)", "servings": 8, "tags": ["sauce", "Vietnamese"], "ingredients": "1 cup nước mắm, fish sauce (Việt Hương, 3 Crabs brand)\n1/2 cup white vinegar\n2 cups + 3 tbsp sugar\n5 cups water\n2 tbsp tương ớt tỏi, chili garlic sauce (Rooster brand)", "steps": "Mix everything in a container.", "notes": "", "source": "https://docs.google.com/document/d/1t3rFj3DKPv3YrVFj6Ky7KQSYNo6fZHICChFm2D_A1gI/edit", "unit": "cups", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Chocolate Chip Cookies", "servings": 20, "tags": ["dessert", "baking"], "ingredients": "1 stick butter, melted\n1 cup dark brown sugar\n1/2 cup regular sugar\n1 egg + 1 egg yolk\n2 tsp vanilla\n2 cups + 2 tbsp flour\n1/2 tsp baking soda\n1/2 tsp salt\n1.5 cups chocolate chips", "steps": "", "notes": "The original doc only has the ingredients. Add the steps next time you make them.", "source": "https://docs.google.com/document/d/1-_Y7ZhZeowfWb2Z7hyHsRPfABsz8Isd0yRWXtexN6Dc/edit", "unit": "cookies", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Dad's Italian Red Sauce", "servings": 6, "tags": ["sauce", "Italian"], "ingredients": "1 28 oz can tomato sauce\n1 10.5 oz can beef broth (chicken broth if not on hand)\n1 6 oz can tomato paste\n1/2 cup red wine (white if you can't find it)\n1/4 cup olive oil\n2 tbsp sugar\n1 tbsp garlic powder\n1 tbsp onion powder\n1 tbsp Italian seasoning\n1 tsp basil\n1 tsp garlic salt\n1 tsp black pepper", "steps": "Combine the ingredients in a small saucepan over heat. Bring to a slight boil, then reduce heat and simmer for 15 to 20 minutes.", "notes": "Sometimes called Red Gravy. Use it for pizza sauce, pasta sauce, or any Italian dish. Sauté onions, peppers and mushrooms in it for a Chicken Cacciatore sauce. It's particularly good to cook meatballs in. Keeps in the fridge for 3 weeks.", "source": "https://docs.google.com/document/d/1V2GbraKPUoJ6x_bk21vO3PXDrhuhPphnn4dyCCT-Q6Q/edit", "unit": "cups", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Buffalo Chicken Pasta", "servings": 4, "tags": ["dinner", "chicken", "pasta"], "ingredients": "Sauce:\n200g pasta sauce, tomato garlic & basil (just under a cup)\n80ml buffalo sauce (1/3 cup)\n220g low fat cottage cheese (just over a cup)\n1/2 tbsp ranch seasoning\nChicken:\n600g thinly cut chicken breast (raw weight)\n1/2 tsp olive oil\n1 tbsp smoked paprika\n1 tsp Cajun seasoning\n1 tsp garlic powder\nsalt\npepper\nPasta:\n320g penne (dry weight), or however much you want\nonions, optional topping", "steps": "Blend the sauce ingredients together.\nPut some oil on the chicken and season both sides with the seasonings.\nBoil the pasta.\nCook the chicken; there's no need for butter since there's oil on it.\nOnce the chicken is done, turn down the heat and add the pasta and sauce to the pan. Add a bit of pasta water and mix until the pasta is covered.\nPlate it, add the chicken and you're good to go. Onions are an optional topping.", "notes": "", "source": "https://docs.google.com/document/d/1lsqKgoJpkRsD-xgGpRAiwLBZbnfD0zAMPJh0dupAcNo/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Mommy's Bread", "servings": 2, "tags": ["baking", "bread"], "ingredients": "1/4 cup potato flakes (10 g)\n1 1/2 cup warm milk (346 g)\n1 cube butter, softened (113 g)\n1/2 cup sugar (90 g) + 1/4 cup\n1 tsp salt (2 g)\n2 tsp yeast\n2 eggs\n4 cups flour (592 g), ideally bread flour", "steps": "Make the dough, then let it sit for at least 30 min. It should at least double.\nSplit it in half, roll it out like a pizza, then roll it into shape. Set the loaves on a baking sheet, spaced out.\nLet it rise again for 30+ min. Again, the dough should double.\nBake at 325°F for 15+ min. Keep an eye on it.", "notes": "", "source": "https://docs.google.com/document/d/1dPSDhI0WjwnPiiuFu5qo61NniG1tMzkGcZgczDAe8vw/edit", "unit": "loaves", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Cinnamon Rolls", "servings": 12, "tags": ["breakfast", "dessert", "baking"], "ingredients": "Dough:\n1/4 cup potato flakes (10 g)\n1 1/2 cup warm milk (346 g)\n1 cube butter, softened (113 g)\n2 tbsp sugar (26 g)\n1 tsp salt (2 g)\n2 tsp yeast\n2 eggs\n4 cups flour (592 g)\nFilling:\n1 stick butter, softened\n1 cup brown sugar\n4-5 tsp cinnamon\nFrosting:\n2 cups powdered sugar (230 g)\n2 tsp vanilla\n2 tbsp milk (+1 tsp if too thick, or 3 tbsp whole milk)", "steps": "Make the dough, then let it sit for at least 30 min. It should at least double.\nRoll out the dough and spread the softened butter over it.\nMix the brown sugar and cinnamon, and spread it over all the dough.\nRoll it all into a long tube.\nCut the tube into equal pieces and set them in the pan.\nLet the rolls rise again for 30+ min.\nBake at 325°F for about 40 min. Keep checking until light golden brown.\nMix the frosting ingredients and spread over the rolls.", "notes": "", "source": "https://docs.google.com/document/d/1TNNc4thq2FJwJUlatRtIhuOsD7jRlKBiYxd8kYc7yrk/edit", "unit": "rolls", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Chicken Broccoli Soup", "servings": 6, "tags": ["dinner", "chicken", "soup"], "ingredients": "2 tbsp olive oil\n1 medium onion, diced\n5 cloves garlic, minced\n1 shallot, minced\n3 carrots, shredded\n4 slices bacon, diced\n4 oz diced pancetta\n2 cups chicken broth\n1 cup whole milk\n1 cup heavy cream\n2 chicken breasts, butterflied\n4 cups broccoli florets, chopped\n2 cups shredded cheddar cheese\n2 tsp dried thyme\n2 tsp garlic powder\n2 tsp onion powder\n1 packet sazon\nsalt and pepper, to taste\n3 tbsp all-purpose flour\n2 tbsp butter", "steps": "In a large pan on medium-high heat, add olive oil and the seasoned chicken. Cook for 4 minutes on each side. Cut up and set aside.\nHeat up a large pot with oil in it.\nAdd the bacon and pancetta and cook until done, then remove from the pot. Add butter to the remaining grease, add the onion and shallot and cook until translucent, about 3-4 minutes.\nAdd salt, pepper, garlic powder and onion powder.\nStir in the minced garlic and cook for another 30 seconds until fragrant.\nAdd the chicken, cover and cook until done and tender enough to shred.\nAdd the flour and mix until well combined (it should be thick-ish). Pour in the chicken broth and heavy cream and stir. Add the carrots and broccoli. Cook for about 5 minutes, stirring occasionally. Reduce to a simmer and cook until the vegetables are tender, about 10-15 minutes.\nPour in the milk and the same seasonings from the chicken and mix well. Add the shredded chicken, cheddar, bacon and pancetta. Stir, taste and adjust with more salt and pepper.", "notes": "", "source": "https://docs.google.com/document/d/1IKdWrQ3VWQFmzQoHb7swTsE7CrLO8nblR51VYDAhzuM/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Pumpkin Muffins", "servings": 24, "tags": ["breakfast", "baking"], "ingredients": "1 box yellow cake mix\n1 small box vanilla pudding mix\n3 eggs\n1 cup pumpkin\n1/2 cup milk\n1/2 cup oil\n1 tsp cinnamon\ncinnamon sugar, for the top", "steps": "Add the ingredients to a KitchenAid and mix for 2-5 min.\nPut the batter in a ziplock bag and cut the corner.\nIn a lined muffin pan, fill each cup about 1/2 to 3/4 full.\nSprinkle with cinnamon sugar before it goes in the oven.\nBake following the cupcake directions on the back of the cake box.", "notes": "", "source": "https://docs.google.com/document/d/1vdwztIWhJMKgmEd79Vt_PqS65_F3b2Hm932s8IwakI8/edit", "unit": "muffins", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "Becca's Secret Salsa", "servings": 8, "tags": ["snack", "dip", "Mexican"], "ingredients": "1 bunch cilantro\n1 bunch green onion (white part + 3 inches)\n1 can stewed tomatoes\n1 can Rotel\n1 can diced green chilis\n2 tbsp sugar\n1 tsp salt\navocado", "steps": "Chop up the cilantro, and the white part plus 3 inches of the green onion.\nAdd the ingredients (except the avocado) to a blender.\nPulse three or four times.\nPour into a bowl, then add the avocado.\nTweak it with salt or extra sugar if needed.", "notes": "Not sure how big the can of Rotel is supposed to be, so experiment with it.", "source": "https://docs.google.com/document/d/1D_WUm0ju4TMnfth63CoP574kNB1z5ZfIoUS42Z0MsyY/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}, {"title": "IHOP Cinn-A-Stack", "servings": 4, "tags": ["breakfast", "sauce"], "ingredients": "1/4 cup salted butter\n3/4 cup brown sugar\n3 tbsp milk\n1 tbsp ground cinnamon\n1/8 tsp salt", "steps": "Melt the butter in a small saucepan over medium heat.\nAdd the brown sugar, 2 tablespoons of the milk, the cinnamon and the salt. Cook, stirring constantly, until it comes to a slight boil.\nImmediately remove from heat, add the remaining tablespoon of milk and stir. If too thick, add a little more milk.", "notes": "Makes enough for at least 4 servings. Use the servings button to double it (the original doc had a ×1/×2/×4/×8 table).", "source": "https://docs.google.com/document/d/1VQ5B5WeHSlta9tKQlsBhQfJTCiIECdJHxJpuQZSvdSQ/edit", "unit": "", "added": "2026-01-03", "prep": "", "cook": ""}];

  if (op.op === 'upsert') return 'r:' + op.recipe.id;
  if (op.op === 'settings') return 'settings';
  if (op.op === 'cook') return 'c:' + op.entry.id;
  if (op.op === 'plan') return 'p:' + op.entry.id;
  return '';
}

/** Change a recipe, with Undo. */
function saveRecipe(r, msg) {
  var before = byId(r.id);
  var undo = before ? [{ op: 'upsert', recipe: clone(before) }] : [{ op: 'delete', id: r.id }];
  queue({ op: 'upsert', recipe: r });
  if (msg) toast(msg, function () { queueMany(undo); render(); });
}

function deleteRecipes(ids, msg) {
  var undo = [];
  ids.forEach(function (id) {
    var r = byId(id);
    if (!r) return;
    undo.push({ op: 'upsert', recipe: clone(r) });
    if (S.pending[id]) undo.push({ op: 'photo', rid: id, data: S.pending[id] });
    delete S.pending[id];
    S.outbox = S.outbox.filter(function (op) { return !(op.op === 'photo' && op.rid === id); });
    queue({ op: 'delete', id: id });
  });
  if (UI.openId && ids.indexOf(UI.openId) >= 0) closeDetail();
  toast(msg || 'Deleted', function () {
    undo.forEach(function (op) { if (op.op === 'photo') queuePhoto(op.rid, op.data); else queue(op); });
    render();
  });
}

function queuePhoto(rid, data) {
  S.pending[rid] = data;
  S.outbox = S.outbox.filter(function (op) { return !(op.op === 'photo' && op.rid === rid); });
  S.outbox.push({ op: 'photo', rid: rid });
  save(); scheduleSync(600);
}

  queue({ op: 'settings', settings: s });
  applyAppearance();

/* ===================== shopping list changes ===================== */
function shopQueue(items, del, undoMsg) {
  var before = [];
  items.forEach(function (it) { var ex = byIdIn(S.shop, it.id); before.push(ex ? clone(ex) : { id: it.id, _new: true }); });
  var gone = (del || []).map(function (id) { return clone(byIdIn(S.shop, id)); }).filter(Boolean);
  queue({ op: 'shop', items: items.map(clone), del: del || [] });
  if (undoMsg) toast(undoMsg, function () {
    var back = before.filter(function (b) { return !b._new; }).concat(gone);
    var remove = before.filter(function (b) { return b._new; }).map(function (b) { return b.id; });
    queue({ op: 'shop', items: back, del: remove });
    render();
  });
}

/** Change rows of a list kept in the sheet (pantry, fridge, prices), with an optional Undo. */
function tableQueue(t, items, del, undoMsg) {
  var before = [];
  items.forEach(function (it) { var ex = byIdIn(S[t], it.id); before.push(ex ? clone(ex) : { id: it.id, _new: true }); });
  var gone = (del || []).map(function (id) { return clone(byIdIn(S[t], id)); }).filter(Boolean);
  queue({ op: 'table', t: t, items: items.map(clone), del: del || [] });
  var undo = function () {
    var back = before.filter(function (b) { return !b._new; }).concat(gone);
    var remove = before.filter(function (b) { return b._new; }).map(function (b) { return b.id; });
    queue({ op: 'table', t: t, items: back, del: remove });
  };
  if (undoMsg) toast(undoMsg, function () { undo(); render(); });
  return undo;

/** Put gathered ingredients on the list; same thing already on it (not yet bought) gets added together. */
function addToShop(gathered, msg) {
  var changed = [];
  gathered.forEach(function (g) {
    var ex = null;
    S.shop.concat(changed).forEach(function (x) { if (!ex && itemKey(x.name) === g.key) ex = x; });
    var from = g.from.join(', ');
    if (ex && !ex.checked) {
      var c = changed.indexOf(ex) >= 0 ? ex : clone(ex);
      c.amount = fmtParts(parseAmount(c.amount).concat(g.parts));
      var have = c.from ? c.from.split(/,\s*/) : [];
      g.from.forEach(function (f) { if (have.indexOf(f) < 0) have.push(f); });
      c.from = have.join(', ');
      if (changed.indexOf(ex) < 0) changed.push(c);
    } else if (ex && ex.checked) {
      var u = clone(ex); u.checked = false; u.amount = g.amount; u.from = from; changed.push(u);
    } else {
      changed.push({ id: newId('s_'), name: g.name, amount: g.amount, section: g.section || sectionFor(g.name), checked: false, from: from });
    }
  });
  if (changed.length) shopQueue(changed, [], msg || ('Added ' + changed.length + (changed.length === 1 ? ' item' : ' items') + ' to your list'));
  return changed.length;

/* ===================== talking to the Google Sheet ===================== */
function request(body, slow) {
  body.pass = S.conn.pass;
  var ctrl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, slow ? SLOW_TIMEOUT : REQ_TIMEOUT);
  var url = S.conn.url, opts;
  if (body.action === 'pull' || body.action === 'ping') {
    url += (url.indexOf('?') >= 0 ? '&' : '?') + 'action=' + body.action + '&pass=' + encodeURIComponent(body.pass) + '&t=' + Date.now();
    opts = { method: 'GET' };
  } else {
    // text/plain avoids a CORS preflight, which Apps Script can't answer
    opts = { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } };
  }
  if (ctrl) opts.signal = ctrl.signal;
  opts.redirect = 'follow';
  return fetch(url, opts).then(function (res) {
    return res.text().then(function (txt) {
      clearTimeout(timer);
      try { return JSON.parse(txt); }
      catch (e) {
        // Google returns a sign-in page when the script isn't shared with "Anyone"
        return { ok: false, code: 'notjson', error: 'The sheet link answered with a web page instead of data. In the deployment, "Who has access" must be "Anyone".' };
      }
    });
  }, function (err) {
    clearTimeout(timer);
    return { ok: false, code: 'net', error: err && err.name === 'AbortError' ? 'The sheet took too long to answer.' : 'No connection.' };
  });
}

var SYNCING = null, SYNC_TIMER = null, RETRY_MS = 15000;
function scheduleSync(ms) {
  clearTimeout(SYNC_TIMER);
  if (!connected()) { renderStatus(); return; }
  SYNC_TIMER = setTimeout(sync, ms || 0);
}

function setSync(state, msg) { UI.syncState = state; UI.syncMsg = msg || ''; renderStatus(); }

function sync() {
  clearTimeout(SYNC_TIMER);
  if (!connected()) { renderStatus(); return Promise.resolve(); }
  if (SYNCING) return SYNCING;
  setSync('busy');
  // first connection: look at the sheet before sending anything, so an empty sheet can be offered your recipes
  var first = S.preview ? pull() : Promise.resolve(true);
  SYNCING = first.then(function (ok) {
    if (!ok) return false;
    if (S.awaitSeed) return true;
    return sendNext().then(function (ok2) { return ok2 ? pull() : false; });
  }).then(function (ok) {
    SYNCING = null;
    if (ok) { RETRY_MS = 15000; setSync('ok'); }
    else if (S.outbox.length) { scheduleSync(RETRY_MS); RETRY_MS = Math.min(RETRY_MS * 2, 300000); }
    return ok;
  }, function (e) { SYNCING = null; setSync('err', String(e && e.message || e)); });
  return SYNCING;
}

/** Send queued changes one at a time. Resolves true when the queue is empty. */
function sendNext() {
  if (!S.outbox.length || S.awaitSeed) return Promise.resolve(true);
  var op = S.outbox[0];
  var body = opRequest(op);
  if (!body) { S.outbox.shift(); save(); return sendNext(); }
  return request(body, op.op === 'addMany' || op.op === 'photo').then(function (res) {
    if (res.ok) {
      if (op.op === 'photo' && res.url) {
        var r = byId(op.rid);
        if (r) r.photo = res.url;
        delete S.pending[op.rid];
      }
      if (S.outbox[0] === op) S.outbox.shift();
      save(); renderStatus();
      return sendNext();
    }
    return handleFail(res, op);
  });
}

function handleFail(res, op) {
  if (res.code === 'net' || res.code === 'busy') { setSync('off', res.error); return false; }
  if (res.code === 'auth') { setSync('err', 'Wrong passphrase. Check it in Settings.'); return false; }
  if (res.code === 'notjson' || res.code === 'unknown') { setSync('err', res.code === 'unknown' ? 'Your sheet\'s script is out of date. Update it (see the setup guide).' : res.error); return false; }
  // the sheet refused this one change for good: drop it so the rest can go through
  if (S.outbox[0] === op) S.outbox.shift();
  if (op.op === 'photo') delete S.pending[op.rid];
  save();
  toast('Couldn\'t save one change: ' + (res.error || 'unknown problem'));
  return sendNext();
}

function opRequest(op) {
  switch (op.op) {
    case 'upsert': return { action: 'upsert', recipe: op.recipe };
    case 'delete': return { action: 'delete', id: op.id };
    case 'addMany': return { action: 'addMany', recipes: op.recipes, cooked: op.cooked || [] };
    case 'cook': return { action: 'cook', entry: op.entry };
    case 'uncook': return { action: 'uncook', id: op.id };
    case 'settings': return { action: 'settings', settings: op.settings };
    case 'plan': return { action: 'plan', entry: op.entry };
    case 'unplan': return { action: 'unplan', id: op.id };
    case 'shop': return { action: 'shop', items: op.items, del: op.del || [] };
    case 'table': return { action: 'table', t: op.t, items: op.items, del: op.del || [] };
    case 'photo':
      var r = byId(op.rid), data = S.pending[op.rid];
      if (!data) return null;
      return { action: 'photo', rid: op.rid, title: r ? r.title : 'recipe', data: data };
  }
  return null;
}

/** Fetch the sheet, rebuild from it, then re-apply anything still waiting to go up. */
function pull() {
  return request({ action: 'pull' }).then(function (res) {
    if (!res.ok) return handleFail(res, null);
    if ((res.v || 0) < SCRIPT_MIN) { setSync('err', 'Your sheet\'s script is out of date. Update it (see the setup guide).'); return false; }
    S.scriptV = res.v || 0;
    S.sheetName = res.name || '';
    var firstTime = S.preview;
    if (firstTime && !res.recipes.length && S.recipes.length) {
      // brand-new sheet: keep what's on the phone until you choose to copy it up
      S.awaitSeed = true;
    }
    if (S.awaitSeed && !res.recipes.length) {
      S.preview = false; S.lastSync = Date.now(); save(); render(); return true;
    }
    S.awaitSeed = false;
    if (firstTime) {
      // edits made to the bundled recipes before connecting only make sense if the sheet has them
      var ids = {}; res.recipes.forEach(function (r) { ids[r.id] = 1; });
      S.outbox = S.outbox.filter(function (op) {
        if (op.op === 'upsert' && /^r_s\d/.test(op.recipe.id) && !ids[op.recipe.id]) return false;
        if (op.op === 'cook' && /^r_s\d/.test(op.entry.rid) && !ids[op.entry.rid]) return false;
        if (op.op === 'plan' && /^r_s\d/.test(op.entry.rid) && !ids[op.entry.rid]) return false;
        return true;
      });
    }
    S.recipes = res.recipes.map(normRecipe);
    S.cooked = res.cooked || [];
    S.plan = (res.plan || []).map(function (e) { e.meals = Math.max(1, +e.meals || 1); return e; });
    S.shop = res.shopping || [];
    S.pantry = res.pantry || [];
    S.fridge = res.fridge || [];
    S.prices = res.prices || [];
    S.emailReady = !!res.emailReady;
    var settingsQueued = S.outbox.some(function (op) { return op.op === 'settings'; });
    if (res.settings && !settingsQueued) S.settings = Object.assign(clone(DEFAULT_SETTINGS), res.settings);
    var sortMoved = azDefault(S.settings);
    S.outbox.forEach(applyOp);
    S.preview = false;
    S.lastSync = Date.now();
    if (UI.openId && !byId(UI.openId)) UI.openId = '';
    save();
    applyAppearance();
    render();
    if (sortMoved) setSettings({});              // tell the sheet about the new default once
    return true;
  });
}

/* ---------- connecting ---------- */
function connect(url, pass) {
  url = String(url || '').trim(); pass = String(pass || '').trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url) && !/^https?:\/\/(localhost|127\.0\.0\.1)/.test(url)) {
    return Promise.resolve({ ok: false, error: 'That doesn\'t look like the script link. It starts with https://script.google.com/ and ends with /exec.' });
  }
  var old = clone(S.conn);
  S.conn = { url: url, pass: pass };
  return request({ action: 'ping' }).then(function (res) {
    if (!res.ok) { S.conn = old; return res; }
    if ((res.v || 0) < SCRIPT_MIN) { S.conn = old; return { ok: false, error: 'That sheet has an older script (version ' + (res.v || 0) + '). Paste the new Code.gs and deploy a new version.' }; }
    S.scriptV = res.v; S.sheetName = res.name || ''; S.emailReady = !!res.emailReady;
    save();
    return sync().then(function () { return { ok: true, name: res.name }; });
  });
}

function disconnect() {
  S.conn = { url: '', pass: '' };
  S.preview = true; S.awaitSeed = false; UI.syncState = 'idle';
  save(); render();
}

/** Copy everything on the phone into an empty sheet. */
function copyToSheet() {
  var recipes = S.recipes.map(function (r) { var c = clone(r); if (/^data:/.test(c.photo)) c.photo = ''; return c; });
  S.awaitSeed = false;
  // one bulk write instead of many little ones
  S.outbox = S.outbox.filter(function (op) { return op.op === 'photo' || op.op === 'settings'; });
  var more = S.plan.map(function (e) { return { op: 'plan', entry: clone(e) }; });
  if (S.shop.length) more.push({ op: 'shop', items: clone(S.shop), del: [] });
  ['pantry', 'fridge', 'prices'].forEach(function (t) { if (S[t].length) more.push({ op: 'table', t: t, items: clone(S[t]), del: [] }); });
  S.outbox = [{ op: 'addMany', recipes: recipes, cooked: clone(S.cooked) }].concat(more, S.outbox);
  save();
  toast('Copying ' + recipes.length + ' recipes to your sheet…');
  return sync();
}

function startEmpty() {
  S.awaitSeed = false; S.recipes = []; S.cooked = []; S.plan = []; S.shop = []; S.pantry = []; S.fridge = []; S.prices = []; S.outbox = []; S.pending = {};
  save(); sync(); render();
}

/* ---------- import from a link ---------- */
/** Without the sheet: ask a free public page reader (r.jina.ai) for the page, then find the recipe in it here. */
function readerImport(url) {
  var nope = 'Couldn\'t get that page without your Google Sheet. Connect it in Settings (it gets past more websites), take screenshots of the recipe and use "Add photos, screenshots or files", or paste the recipe text below.';
  if (!window.fetch) return Promise.resolve({ ok: false, error: nope });
  var ctl = window.AbortController ? new AbortController() : null, timer = ctl && setTimeout(function () { ctl.abort(); }, 25000);
  return fetch('https://r.jina.ai/' + url, { headers: { 'X-Return-Format': 'html' }, signal: ctl ? ctl.signal : undefined }).then(function (res) {
    if (timer) clearTimeout(timer);
    if (!res.ok) throw new Error('http');
    return res.text();
  }).then(function (html) {
    var rec = parseRecipeHtmlC(html, url);
    if (rec && (rec.ingredients || rec.steps)) { rec.source = url; return { ok: true, recipe: rec }; }
    var t = recipeTextC(html);
    if (!t) return { ok: false, error: 'No recipe found on that page. Take screenshots of the recipe and use "Add photos, screenshots or files", or paste the text below.' };
    var p = parseRecipeText(t);
    var r2 = { title: titleCase(p.title), ingredients: p.ingredients, steps: p.steps, notes: p.notes, servings: p.servings, unit: p.unit, source: url, photo: metaContentC(html, 'og:image') };
    r2.tags = suggestTags(normRecipe(r2), []);
    return { ok: true, recipe: r2 };
  }, function () {
    if (timer) clearTimeout(timer);
    return { ok: false, error: navigator.onLine === false ? 'No connection right now. Try again when you\'re online.' : nope };
  });
}
function importLink(url) {
  url = String(url || '').trim();
  if (!/^https?:\/\//i.test(url)) return Promise.resolve({ ok: false, error: 'Paste the full link, starting with https://' });
  if (!connected()) return readerImport(url);
  return request({ action: 'import', url: url }, true).then(function (res) {
    if (!res.ok) {
      var why = res.code === 'blocked' ? 'That website won\'t share its page. Take screenshots of the recipe and use "Add photos, screenshots or files", or paste the text below.'
        : res.code === 'norecipe' ? 'No recipe found on that page. Take screenshots of the recipe and use "Add photos, screenshots or files", or paste the text below.'
          : res.code === 'net' ? 'No connection right now. Try again when you\'re online.'
            : (res.error || 'Import didn\'t work.');
      return { ok: false, error: why };
    }
    if (res.kind === 'text') {
      var p = parseRecipeText(res.text, String(res.title || '').replace(/\s+[|–—]\s+[^|–—]+$/, ''));
      var ttl = String(res.title || '').replace(/\s+[|–—]\s+[^|–—]+$/, '').replace(/\s+-\s+[^-]{2,40}$/, '');
      var fromDoc = { title: titleCase(p.title && p.title !== 'Ingredients' ? p.title : ttl), ingredients: p.ingredients, steps: p.steps, notes: p.notes, source: url, servings: p.servings, unit: p.unit, photo: res.photo || '' };
      fromDoc.tags = suggestTags(normRecipe(fromDoc), []);
      return { ok: true, recipe: fromDoc };
    }
    var rec = res.recipe;
    var site = rec.tags || [];
    rec.tags = cleanSiteTags(site);
    suggestTags(normRecipe(rec), site).forEach(function (t) { if (rec.tags.map(function (x) { return x.toLowerCase(); }).indexOf(t) < 0) rec.tags.push(t); });
    return { ok: true, recipe: rec };
  });
}

function titleCase(s) {
  s = String(s || '').trim();
  if (s && s === s.toLowerCase()) return s.replace(/(^|\s)(\S)/g, function (m, a, b) { return a + b.toUpperCase(); });
  return s;
}
